name: Build

on:
  push:
    branches:
      - main
    # Release path: a `<product>-v*` tag push (parsed + validated in the build-docs job). Continuous CI runs
    # on branch pushes + PRs; only product-tag pushes take the release path.
    tags:
      - '*-v*'
  pull_request:
  workflow_dispatch:

# Least-privilege default: every job is read-only unless it explicitly opts into more. Only the release-gated
# job that creates + populates the GitHub Release requests contents: write.
permissions:
  contents: read

jobs:
    text-hygiene:
        # LF line endings, UTF-8 without a BOM, and the canonical PowerShell header. Runs on every trigger,
        # not just pull requests: the defect this catches is invisible locally — with `* text=auto` declared,
        # a tool writing CRLF into the working tree still produces an LF blob and a clean `git status`, so
        # nothing short of an explicit check reports it. Seven CRLF catalogues sat here undetected that way.
        #
        # Its own job rather than a step inside build-docs, so a failure names the offending file instead of
        # being buried in a render log, and so it reports in seconds without waiting on the toolchain setup.
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7
              with:
                # The check reads the working tree and the index, so the submodule is not needed — and
                # tools/po4a is third-party upstream that this contract deliberately does not cover.
                submodules: false

            - name: Check text-file hygiene
              shell: pwsh
              run: ./scripts/Test-TextFileHygiene.ps1

    catalogue-ownership:
        # The repository owns the .pot templates; Weblate owns the .po translations and is their only writer.
        # Two writers on one .po is what conflicts every language of a catalogue at once — both sides rewrite
        # adjacent header lines (POT-Creation-Date against PO-Revision-Date / Last-Translator / Language-Team /
        # X-Generator) inside a single hunk git cannot auto-merge. A prose rule did not hold, so this enforces it.
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7
              with:
                # Need the base commit to diff against; a shallow clone has neither side.
                fetch-depth: 0

            - name: Reject hand-written changes to Weblate-owned catalogues
              shell: bash
              run: |
                base="origin/${{ github.base_ref }}"
                # The pull request's own tip, NOT HEAD. On a pull_request event actions/checkout checks out
                # refs/pull/N/merge, a synthetic merge commit GitHub creates and commits under its own identity.
                # That commit touches a .po whenever both sides changed one, so a committer check against HEAD
                # rejects pull requests whose every real commit is Weblate's.
                head="${{ github.event.pull_request.head.sha }}"
                # Weblate-owned: every catalogue registered as a Weblate component. scripts/po/*.po and
                # po/antibiotics.*.po are deliberately absent — they are not on Weblate and remain
                # repository-owned, so a hand edit or a generator run there is legitimate. The antibiotic
                # catalogue cannot be hosted: its content is CC BY-NC-SA 3.0 IGO, and a NonCommercial term is not
                # a free licence, which Hosted Weblate's free plan requires. Add a catalogue here when it is
                # registered on Weblate, and remove it here when it is not.
                owned='po/reports\..*\.po|po/documentation\..*\.po|po/infectious_agents\..*\.po|po/metadata\..*\.po|po/glossary\..*\.po'
                # Weblate commits everything it pushes under this one identity, whoever wrote the translation,
                # so a per-commit committer check recognises Weblate's own output no matter who opened the pull
                # request. Exempting by pull-request author instead would reject the drain pull requests we open
                # ourselves from a weblate-* branch, whose commits are Weblate's throughout — and would wave
                # through a stray hand-written commit riding along in a Weblate-authored one.
                weblate='hosted@weblate.org'

                # --no-renames matters: with rename detection on, git prints only a rename's DESTINATION, so
                # `git mv po/reports.de.po elsewhere.po` plus a hand edit shows a path that cannot match the
                # pattern and the file escapes the gate entirely. Splitting renames into delete+add surfaces
                # the owned source path. Assigned separately from the grep so that a git failure cannot be
                # swallowed by the `|| true` and read as "nothing offending".
                if ! changed=$(git diff --name-only --no-renames "$base...$head"); then
                  echo "::error::Could not diff $base...$head — the gate cannot vouch for this pull request."
                  exit 1
                fi

                offending=""
                # `|| true` would ignore EVERY non-zero status; the contract this gate wants is narrower and
                # is stated in the loop below — grep's exit 1 means "no matches", which is how it says the
                # input is clean, and anything ABOVE 1 is grep itself failing. Collapsing the two lets a
                # filter that could not run read as "nothing owned was changed": measured under Actions'
                # `bash -eo pipefail`, an unrunnable pattern took the old form to "PASSED, exit 0" on a
                # changed catalogue it should have rejected. Not reachable while `$owned` is a literal that
                # compiles — but "correct because today's pattern happens to compile" is a property of the
                # input rather than of this gate, which is the same reasoning that closed the rename and
                # word-splitting escapes above.
                #
                # `|| rc=$?` rather than a bare assignment: under `set -e` a failing command substitution
                # ends the step before the status can be inspected at all.
                rc=0
                matched=$(printf '%s\n' "$changed" | grep -E "^($owned)$") || rc=$?
                if [ "$rc" -gt 1 ]; then
                  echo "::error::The ownership filter could not run (grep exit $rc) — the gate cannot vouch for this pull request."
                  exit 1
                fi
                # `while IFS= read -r`, not `for f in $(…)`: the unquoted expansion word-splits on IFS, so a
                # matching path containing a space arrives as two fragments, neither of which names a real
                # file — `git log -- po/reports.de` returns nothing, the loop reads that as "no non-Weblate
                # committers", and the gate passes. Same shape as the two fail-opens below: an error state
                # indistinguishable from the clean state. Reachable only via a hand-created path, since
                # Weblate's own `language_regex` cannot produce one — but "correct because today's filemask
                # happens to yield space-free paths" is a property of the data, not of this gate.
                #
                # Fed by a here-string rather than a pipe: a piped `while` runs in a SUBSHELL, so every
                # `offending=` assignment would be discarded at `done` and the gate would pass on precisely
                # the files it had just rejected.
                while IFS= read -r f; do
                  # A here-string always emits at least one line, so an empty match list arrives here as a
                  # single empty string rather than as no iterations at all.
                  [ -n "$f" ] || continue
                  # The git call is separated from the grep deliberately. With `|| true` spanning the whole
                  # pipeline, a git failure — a missing ref, an unreadable path — produced an empty string,
                  # which this loop reads as "no non-Weblate committers" and the gate then PASSES. A guard
                  # whose error path is indistinguishable from its success path fails open, which is the one
                  # direction it must never fail. Only the grep's own "no matches" status is ignored, since
                  # that is its way of saying the file is clean.
                  if ! committers=$(git log --format='%ce' "$base".."$head" -- "$f"); then
                    echo "::error::Could not read the commit history of $f — the gate cannot vouch for this pull request."
                    exit 1
                  fi
                  # Not `grep -q`: it exits on the first hit, and SIGPIPE plus `pipefail` would then report
                  # the pipeline as failed, which reads here as "no offence found" and silently passes.
                  # Same narrowing as the filter above, and here the two statuses are load-bearing in
                  # opposite directions: `grep -vFx` exits 1 when every committer IS Weblate — the clean
                  # case, which must stay ignored — and 0 when a non-Weblate committer exists, which is the
                  # offence. So this cannot become a bare `grep` with no `||` at all; 0 and 1 are both
                  # expected answers and only 2 and above mean the filter failed.
                  rc=0
                  others=$(printf '%s\n' "$committers" | grep -vFx "$weblate") || rc=$?
                  if [ "$rc" -gt 1 ]; then
                    echo "::error::The committer filter could not run for $f (grep exit $rc) — the gate cannot vouch for this pull request."
                    exit 1
                  fi
                  if [ -n "$others" ]; then offending="${offending}${f}"$'\n'; fi
                done <<< "$matched"
                if [ -n "$offending" ]; then
                  echo "::error::This pull request modifies Weblate-owned .po files. Weblate is their only writer."
                  # `|| continue`, not `[ -n "$f" ] && echo`: `$offending` ends in a newline and `echo` adds
                  # another, so the last iteration reads "" and the `&&` short-circuits to status 1. That
                  # becomes the loop's exit status, and under Actions' `bash --noprofile --norc -eo pipefail`
                  # it ends the step right here — discarding every guidance line below, which is the whole
                  # point of the failure path. The gate still rejects correctly; the person who tripped it
                  # just loses the per-catalogue remedies written to help them fix it. The checking loop above
                  # already uses `|| continue` for this reason, and a here-string rather than a pipe keeps the
                  # two loops the same shape.
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    echo "::error file=$f::$f is owned by Weblate — make the change there, not here."
                  done <<< "$offending"
                  echo
                  echo "Translations, corrections and terminology go through https://hosted.weblate.org/projects/neoipc/"
                  echo
                  echo "If a local run produced these, which catalogue it is decides the remedy:"
                  echo "  po/reports.* po/documentation.* po/infectious_agents.*"
                  echo "      Invoke-Localization.ps1 -Update restores them; seeing them here is a bug in that script."
                  echo "  po/glossary.*"
                  echo "      update-glossary-po.py did NOT write these: it emits po/glossary.pot alone and has no"
                  echo "      per-language write path at all. A hand edit is the likely route; the same"
                  echo "      Export-NeoIPCAntibioticTranslation -PoBaseName hazard described below applies here too."
                  echo "      Restore from the BASE branch and commit only po/glossary.pot."
                  echo "  po/metadata.*"
                  echo "      Export-NeoIPCMetadataTranslation did NOT write these: it emits po/metadata.pot alone"
                  echo "      and has no parameter that could name a language. Two routes remain — a hand edit, or"
                  echo "      Export-NeoIPCAntibioticTranslation, whose -PoBaseName accepts any catalogue name and"
                  echo "      whose -PoDirectory defaults to po/, so -PoBaseName metadata rewrites all of them."
                  echo "      Restore them from the BASE branch, not from HEAD — by the time this gate fires the"
                  echo "      change is already committed, so --source=HEAD would restore the very version being"
                  echo "      rejected:"
                  # $base, not a hard-coded origin/main: the job already computed the real base ref, and a
                  # literal would print the wrong instruction the moment this runs against any other base
                  # branch — inside the failure message of a gate, where the reader is least able to check it.
                  echo "      git restore --source=$base --worktree -- po/metadata.*.po"
                  echo "      then commit only po/metadata.pot."
                  exit 1
                fi
                echo "No Weblate-owned catalogue was modified outside Weblate."

    po-placeholders:
        # Placeholder integrity between each msgid and its msgstr: printf tokens, inline R spans, Quarto
        # cross-references, .NET-style placeholders and LaTeX text markers. Two of those Weblate's own
        # server-side checks cannot express, which is why this stays a repository gate rather than being
        # retired into component flags — the CONTENT of an inline R span (a translation that rewrites a
        # variable name inside `r ...` keeps the token count, passes every Weblate check, and feeds a
        # different expression to the renderer), and count parity wherever Weblate compares sets, which a
        # partial drop survives. Which checks Weblate does cover is measured per catalogue in
        # docs/weblate-checks-adoption.md.
        #
        # Its own job for the same reason text-hygiene is one: a finding names the catalogue and line
        # rather than being buried in a render log, and it reports without waiting on the toolchain setup.
        #
        # REPORT-ONLY, deliberately and temporarily. The committed catalogues already carry violations,
        # and every one of them sits inside a Weblate-owned .po that the ownership gate above forbids
        # changing here — so a blocking gate today would fail every pull request over defects that can
        # only be fixed through Weblate. This makes them visible on every run until they are; dropping
        # -ReportOnly is the whole of the change that makes it blocking.
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7
              with:
                # Reads the committed catalogues only; no submodule and no toolchain are involved.
                submodules: false

            - name: Check placeholder integrity between source and translations
              shell: pwsh
              # -ReportOnly rather than the step's own continue-on-error, and the difference is the point:
              # continue-on-error swallows EVERY non-zero exit, including the one this script raises when
              # it matched no files at all. That would be a gate reporting success having inspected
              # nothing — the failure shape this repository has already been bitten by. The switch waives
              # the violation count; a run that could not inspect anything still fails.
              run: ./scripts/Test-PoPlaceholders.ps1 -ReportOnly

    python-tests:
        # The Python tools under scripts/ had no gate at all. That was defensible while there was one of
        # them and it was a developer-machine convenience; it stops being defensible as the Python surface
        # grows, and it was already costing more than it looked — test_update_glossary_po.py asserts the
        # committed po/glossary.pot still matches what the committed glossary.yaml produces, which is a
        # claim about the repository that only a run can check. It caught 41 stale location references
        # once. Nothing has run it since.
        #
        # Its own job, like text-hygiene and po-placeholders: it needs none of the toolchain build-docs
        # spends minutes assembling, so a failure here names itself in seconds instead of arriving at the
        # end of a render log.
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7
              with:
                # The tests read committed files and re-run the generators over them; no submodule is
                # involved, and po4a (the one thing that would need tools/po4a) is not exercised here.
                submodules: false

            - uses: actions/setup-python@v6
              with:
                # Pinned for the same reason the runner image is: an interpreter that moves under the gate
                # turns an unrelated release into a red build nobody changed anything to cause.
                python-version: '3.13'

            - name: Install pytest and the generators' dependencies
              # The tests run the real scripts rather than importing pieces of them, so they need what
              # those scripts need. Minimum versions rather than exact pins: these are stable, widely-used
              # libraries, and pinning them exactly would make this gate a dependency-bump chore.
              #
              # wlc has to be here even though no test talks to Weblate: sync-weblate.py imports it at
              # module scope and answers ImportError with sys.exit, so loading its test file raises
              # SystemExit during COLLECTION. That is not one red test -- it tears the session down before
              # any file is collected, so every other test stops running too and the job reports an
              # internal error rather than a failure. requests is wlc's own dependency, named here because
              # sync-weblate.py imports it directly.
              #
              # fontTools and uharfbuzz are what the collection sheets are MEASURED with, so the generator
              # refuses to start without them and every one of its tests goes red here while passing on a
              # developer's machine -- which is the direction that gets noticed late, because the gate is
              # failing on its own environment rather than on the code under test.
              #
              # tinycss2 reads the type scale out of a drawn figure's own stylesheet, which is where it
              # belongs: a size stated in the figure and again in the generator is a build that measures
              # at one and draws at the other.
              run: python -m pip install --upgrade pytest 'ruamel.yaml>=0.18' 'polib>=1.2'
                   'fonttools>=4.50' 'uharfbuzz>=0.39' 'tinycss2>=1.3' wlc requests

            - name: Install Typst
              shell: bash
              # The engine that draws the printed forms. Pinned, and the pin is a contract rather than
              # caution: the generator measures with uharfbuzz while Typst shapes with rustybuzz, a port of
              # the same library, and every run the emitted document places asserts that the two agree
              # exactly. A different engine version is a different shaper, so the assertion only means
              # something against a known one. Taken from the release rather than a distribution package,
              # which lags and would drift the version out from under that assertion.
              #
              # Its absence does not quietly skip the test: the suite fails by name wherever CI is set,
              # because a gate that stops running reads exactly like one that passes.
              run: |
                curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
                sudo install -m 0755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
                typst --version

            - name: Run the Python tests
              # pytest discovers, so a new tool's test is gated by existing here rather than by someone
              # remembering to add a line -- and it collects test_*.py, which is why the one file that
              # predates this job is named with underscores rather than the hyphens the other scripts use.
              #
              # It also settles the empty case, which is the hazard a hand-rolled loop has to remember:
              # pytest exits 5 when it collects nothing, so "the gate ran zero tests" is a non-zero exit by
              # construction rather than by anyone recalling that a gate which inspects nothing has already
              # bitten this repository twice.
              run: python -m pytest scripts/ -v

    build-docs:
        # Pinned to an explicit image for reproducibility; 26.04 provides the .NET 10 / PowerShell 7.6
        # runtime the NeoIPC-Tools module and data-dictionary generator require.
        runs-on: ubuntu-26.04
        # Expose the parsed product release to the release-gated jobs (empty on non-release triggers).
        outputs:
          product: ${{ steps.rel.outputs.product }}
          version: ${{ steps.rel.outputs.version }}
          vfile: ${{ steps.rel.outputs.vfile }}
        steps:
            - name: Parse and validate the product release tag
              # This repository publishes FIVE independently-versioned products from one history, each with its own
              # tag stream: protocol-v*, metadata-v*, reports-v*, infectious-agents-v*, antibiotics-v*. On a
              # published Release the tag names the product (prefix) and its version; parse both here and fail fast on
              # a malformed tag before the heavy build. The parsed product gates which product is built + attached
              # below; its version is matched against the product's VERSION file after checkout.
              id: rel
              if: github.ref_type == 'tag'
              shell: bash
              run: |
                tag="$GITHUB_REF_NAME"
                # <product>-vMAJOR.MINOR.PATCH with an optional standard semver pre-release suffix
                # (dot-separated alphanumeric identifiers), e.g. -alpha, -rc.1, -preview1.
                pattern='^(protocol|metadata|reports|infectious-agents|antibiotics)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$'
                if [[ ! "$tag" =~ $pattern ]]; then
                  echo "::error::Release tag '$tag' must be <product>-vMAJOR.MINOR.PATCH[-prerelease] (product one of protocol|metadata|reports|infectious-agents|antibiotics; e.g. reports-v0.0.1-alpha, protocol-v1.3.0-preview1, infectious-agents-v1.2.0)."
                  exit 1
                fi
                product="${BASH_REMATCH[1]}"
                version="${BASH_REMATCH[2]}"
                case "$product" in
                  protocol)          vfile="doc/protocol/VERSION" ;;
                  metadata)          vfile="metadata/VERSION" ;;
                  reports)           vfile="reports/VERSION" ;;
                  infectious-agents) vfile="metadata/common/infectious-agents/VERSION" ;;
                  antibiotics)       vfile="metadata/common/antibiotics/VERSION" ;;
                esac
                {
                  echo "product=$product"
                  echo "version=$version"
                  echo "vfile=$vfile"
                } >> "$GITHUB_OUTPUT"
                echo "Parsed release: product=$product version=$version (source of truth: $vfile)."

            - uses: actions/checkout@v7
              with:
                submodules: true
                # Full history + tags: the incorporation check below diffs each shared list against its release tag.
                fetch-depth: 0

            - name: Verify the release tag matches the product VERSION file
              # On a published Release the parsed version must equal the released product's committed VERSION, so a
              # release is always cut from a commit whose per-product VERSION declares exactly that version — no
              # tag/file drift.
              if: github.ref_type == 'tag'
              shell: bash
              run: |
                vfile="${{ steps.rel.outputs.vfile }}"
                want="${{ steps.rel.outputs.version }}"
                file="$(sed '1s/^\xef\xbb\xbf//' "$vfile" | tr -d '[:space:]')"
                if [[ "$want" != "$file" ]]; then
                  echo "::error::Release version '$want' does not match $vfile ('$file'). Bump $vfile to match before releasing."
                  exit 1
                fi
                echo "Release version matches $vfile ($file)."

            - name: Reject a moved / retagged release tag
              # A tag push with created=false means an existing tag was force-moved. Releases are immutable --
              # cut a new version rather than re-pointing a tag.
              if: github.ref_type == 'tag' && github.event.created != true
              shell: bash
              run: |
                echo "::error::Tag '$GITHUB_REF_NAME' already existed and was moved; releases are immutable. Cut a new version instead."
                exit 1

            - name: Enforce monotonic version (per-line, semver-correct)
              # The tag must be strictly greater than the highest already-released version of THIS product on
              # its major.minor line; a new line (and backports on older lines) are allowed. The triggering tag
              # is excluded from the history (checkout fetch-depth: 0 includes it). Map a pre-release '-' -> '~'
              # before `sort -V` so its tilde rule orders e.g. 1.3.0-preview1 before 1.3.0 (correct precedence).
              if: github.ref_type == 'tag'
              shell: bash
              run: |
                product="${{ steps.rel.outputs.product }}"
                ver="${{ steps.rel.outputs.version }}"
                pfx="${product}-v"
                line="$(cut -d. -f1-2 <<<"$ver")."
                mapfile -t vers < <(git tag -l "${pfx}*" | sed "s/^${pfx}//" | grep -vxF "$ver" || true)
                same="$(printf '%s\n' "${vers[@]}" | grep -E "^${line//./\\.}" | sed 's/-/~/' | sort -V | sed 's/~/-/' | tail -1 || true)"
                if [ -n "$same" ]; then
                  hi="$(printf '%s\n%s\n' "$same" "$ver" | sed 's/-/~/' | sort -V | sed 's/~/-/' | tail -1)"
                  if [ "$hi" != "$ver" ]; then
                    echo "::error::Release '$product $ver' is not greater than the last released '$same' on the ${line%.} line."
                    exit 1
                  fi
                  echo "Monotonic OK: $product $ver > $same (line ${line%.})."
                else
                  echo "Monotonic OK: new $product ${line%.} line."
                fi

            - name: Enforce incorporated shared-list versions
              # The protocol and metadata products COMPILE the infectious agent list and the antibiotics list into
              # their artifacts, but those lists are their own products. Each product declares in its
              # compatibility.yml which released list version it incorporates. Enforce, for each declared list:
              #   (1) the <list>-v<version> release tag exists, and
              #   (2) the list's committed source at this commit is byte-identical to what that release shipped.
              # So a protocol/metadata release can never incorporate list content that was not itself released.
              # Translations are intentionally out of scope for the content check (see RELEASING.md).
              if: github.ref_type == 'tag' && (steps.rel.outputs.product == 'protocol' || steps.rel.outputs.product == 'metadata')
              shell: bash
              run: |
                case "${{ steps.rel.outputs.product }}" in
                  protocol) compat="doc/protocol/compatibility.yml" ;;
                  metadata) compat="metadata/compatibility.yml" ;;
                esac
                status=0
                check_list() {
                  local list="$1"; shift
                  local declared tag
                  declared="$(awk -v k="$list:" '$1==k{print $2; exit}' "$compat")"
                  if [ -z "$declared" ]; then
                    echo "::error::$compat does not declare incorporates.$list."; status=1; return
                  fi
                  tag="$list-v$declared"
                  if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                    echo "::error::$compat declares $list $declared but no '$tag' release tag exists — publish the $list release first."; status=1; return
                  fi
                  if ! git diff --quiet "$tag" HEAD -- "$@"; then
                    echo "::error::The $list content changed since '$tag'. Bump metadata/common/$list/VERSION, publish an $list-v<new> release, and set incorporates.$list in $compat to <new> before releasing this product."; status=1; return
                  fi
                  echo "$list OK: incorporates $declared ($tag); content matches HEAD."
                }
                # The two consuming products read DIFFERENT pathogen sources: the metadata package reads the
                # canonical NeoIPC-Infectious-Agents.yaml, but the protocol still compiles the legacy pathogen CSVs
                # (New-PathogenList) pending the CSV->YAML migration. Track the union so a change to EITHER source
                # forces a list re-release before either product ships it. (Drop the legacy CSVs here once the
                # protocol reads the YAML.) Translations (*.de.csv etc.) stay out of scope.
                check_list infectious-agents \
                  metadata/common/infectious-agents/NeoIPC-Infectious-Agents.yaml \
                  metadata/common/infectious-agents/NeoIPC-Infectious-Agents.uids.csv \
                  metadata/common/infectious-agents/NeoIPC-Owned-Pathogen-Concepts.csv \
                  metadata/common/infectious-agents/NeoIPC-Pathogen-Concepts.csv \
                  metadata/common/infectious-agents/NeoIPC-Pathogen-Synonyms.csv \
                  metadata/common/infectious-agents/ListElements.csv
                check_list antibiotics \
                  metadata/common/antibiotics/NeoIPC-Antibiotics.csv \
                  metadata/common/antibiotics/NeoIPC-Antibiotic-Groups.csv \
                  metadata/common/antibiotics/NeoIPC-Antibiotic-AWaRe-Groups.csv \
                  metadata/common/antibiotics/ListElements.csv
                exit $status

            - name: Enforce referenced neoipcr / neoipc-app releases exist
              # The reports product is validated against specific neoipcr + neoipc-app releases, recorded in
              # reports/compatibility.yml. Those live in separate repos, so (unlike the in-repo lists) there is no
              # tree to diff — instead require each referenced version to be a real published release on its repo, so
              # a reports release can never claim compatibility with an unreleased neoipcr/neoipc-app. Public repos,
              # no auth (git ls-remote — not the DHIS2 API).
              if: github.ref_type == 'tag' && steps.rel.outputs.product == 'reports'
              shell: bash
              run: |
                get_tested() {  # $1 = top-level section key in reports/compatibility.yml
                  awk -v sec="$1:" '
                    /^[^[:space:]#]/ { in_sec = ($1 == sec) }
                    in_sec && $1 == "tested:" { print $2; exit }
                  ' reports/compatibility.yml
                }
                status=0
                check_release() {  # $1 = owner/repo, $2 = tag
                  if [ -z "$2" ]; then
                    echo "::error::reports/compatibility.yml has no tested version for $1."; status=1; return
                  fi
                  if git ls-remote --exit-code --tags "https://github.com/$1.git" "refs/tags/$2" >/dev/null 2>&1; then
                    echo "$1 @ $2 exists."
                  else
                    echo "::error::reports/compatibility.yml declares $1 $2 (tested) but no such release tag exists on https://github.com/$1 — publish that release before releasing the reports."; status=1
                  fi
                }
                check_release NeoIPC/neoipcr "$(get_tested neoipcr)"
                check_release NeoIPC/neoipc-app "$(get_tested neoipc-app)"
                exit $status

            # ── Metadata product group ─────────────────────────────────────────────────────────────────────────
            # Runs on every non-release trigger (continuous CI builds all products), and on a metadata-v* release.
            - name: Set up .NET 10 (for the data-dictionary .xlsx writer)
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'metadata'
              uses: actions/setup-dotnet@v5
              with:
                dotnet-version: '10.0.x'

            # ── po4a toolchain (Perl) ──────────────────────────────────────────────────────────────────────────
            # Needed by the protocol AND the infectious agent list (both localize via po4a).
            - name: Install po4a dependencies
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'protocol' || steps.rel.outputs.product == 'infectious-agents'
              shell: bash
              run: |
                sudo apt-get update -qq
                sudo apt-get install -qq gettext liblocale-gettext-perl libtext-wrapi18n-perl libsyntax-keyword-try-perl libtimedate-perl libyaml-tiny-perl libpod-parser-perl libmodule-build-perl

            # ── Protocol rendering toolchain (Pandoc/AsciiDoctor) — protocol only. ──────────────────────────────
            - name: Install protocol build dependencies
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'protocol'
              shell: bash
              run: |
                sudo apt-get update -qq
                sudo apt-get install -qq pandoc librsvg2-bin bison flex libffi-dev libxml2-dev libgdk-pixbuf-2.0-dev libcairo2-dev libpango1.0-dev libwebp-dev fonts-lyx fonts-noto-core
                # CMAKE_POLICY_VERSION_MINIMUM lets the gems' bundled mtex2MML (an old cmake_minimum_required)
                # configure under the CMake 4 on Ubuntu 26.04; passed through sudo, which otherwise resets env.
                sudo env CMAKE_POLICY_VERSION_MINIMUM=3.5 gem install mathematical:1.7.0 asciidoctor-pdf asciidoctor-bibtex asciidoctor-diagram asciimath asciidoctor-mathematical
                sudo npm install -g @linthtml/linthtml

            - uses: actions/setup-python@v6
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'protocol'
              with:
                # Pinned to match the python-tests job: the same generator runs in both, and an
                # interpreter that moves under one of them turns an unrelated release into a red build.
                python-version: '3.13'

            - name: Install the collection-sheet generator's dependencies
              # The protocol build generates its own figures, so this job runs build-collection-sheets.py
              # and needs what that script imports. Deliberately the same list the python-tests job
              # installs: fontTools and uharfbuzz are what the sheets are MEASURED with, tinycss2 reads a
              # drawn figure's type scale out of its own stylesheet, and polib and ruamel.yaml read the
              # catalogue and the layout. The generator refuses to start without any of them rather than
              # drawing something it could not measure — which is how this job failed the first time it
              # ran, having had the toolchain for everything except the figures it now produces.
              #
              # Find-Python takes `python3` before `python`, and setup-python puts its own first on PATH,
              # so this installs into the interpreter the build will actually use.
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'protocol'
              shell: bash
              run: python -m pip install --upgrade
                   'fonttools>=4.50' 'uharfbuzz>=0.39' 'tinycss2>=1.3' 'polib>=1.2' 'ruamel.yaml>=0.18'

            - name: Install Typst (the printed forms' engine)
              # The protocol build compiles the collection forms a partner prints, so the protocol toolchain
              # now includes Typst. Pinned for the same reason the test job pins it: the generator measures
              # with uharfbuzz and Typst shapes with rustybuzz, and every run the emitted document places
              # asserts the two agree exactly, so a different version is a different shaper.
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'protocol'
              shell: bash
              run: |
                curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
                sudo install -m 0755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
                typst --version

            # Use the pinned po4a submodule (tools/po4a) — the Ubuntu apt po4a is too old to recognise the
            # --width / --wrap-po options our configs use. Invocation matches the CLAUDE.md "po4a setup" section.
            - name: Run po4a (infectious agents)
              # Generates the localized NeoIPC-Infectious-Agents.<lang>.yaml — consumed by the protocol build (pathogen
              # list) and bundled into the infectious agent list release.
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'protocol' || steps.rel.outputs.product == 'infectious-agents'
              shell: bash
              # PERL_UNICODE=SDA must match scripts/Invoke-Localization.ps1: it decodes @ARGV/open() as UTF-8 so
              # po4a reads the .cfg's non-ASCII --copyright-holder correctly instead of double-encoding it into
              # the regenerated .pot header. Keep the two po4a invocation sites in sync.
              # --no-update renders from the catalogues exactly as committed, writing neither .pot nor .po. Without
              # it CI msgmerges its checkout and then builds from a merged state that is not what is on main, which
              # hides drift instead of surfacing it. This is what Invoke-Localization.ps1 -Render does.
              run: PERL_UNICODE=SDA PERLLIB=tools/po4a/lib tools/po4a/po4a --verbose --no-update po/infectious_agents.po4a.cfg

            - name: Run po4a (documentation)
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'protocol'
              shell: bash
              # PERL_UNICODE=SDA and --no-update: see the infectious-agents po4a step above (keep the two sites in sync).
              run: PERL_UNICODE=SDA PERLLIB=tools/po4a/lib tools/po4a/po4a --verbose --no-update po/documentation.po4a.cfg

            - name: Build
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'protocol'
              shell: pwsh
              run: ./scripts/Build-NeoIPCCoreProtocol.ps1 -InformationAction Continue -WarningAction:Stop

            - name: Install R for the interpolation gate's behavioural half
              # ReportInterpolationHygiene proves that a translated string cannot reach R's evaluator, and
              # the half that PROVES it runs R: it asks the helper to interpolate `{Sys.time()}` and
              # requires a refusal. Those assertions were skipped wherever Rscript was absent, which is
              # every runner, so the security property was gated by a grep alone and the log read the same
              # either way. The test now fails on a runner without R rather than skipping, so this step is
              # what keeps it green — and glue comes from apt because the helper calls glue_safe.
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'metadata'
              shell: bash
              run: |
                sudo apt-get update -qq
                sudo apt-get install -qq r-base-core r-cran-glue
                Rscript -e 'cat(R.version.string, "| glue", as.character(packageVersion("glue")), "\n")'

            # ── Metadata product group (continued) ─────────────────────────────────────────────────────────────
            - name: Provision and test NeoIPC-Tools
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'metadata'
              shell: pwsh
              run: |
                # Provision the DocumentFormat.OpenXml assembly the .xlsx writer loads, then run the module
                # tests so the OpenXmlValidator-backed XLSX schema-validity gate runs in CI (it is skipped only
                # when the assembly is absent).
                dotnet publish scripts/modules/NeoIPC-Tools/lib -o scripts/modules/NeoIPC-Tools/lib/bin -c Release --nologo
                Install-Module -Name Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
                # powershell-yaml: the metadata assembler reads the infectious-agents / sharing YAML when
                # building the package the data dictionary flattens.
                Install-Module -Name powershell-yaml -MinimumVersion 0.4.2 -Force -Scope CurrentUser -SkipPublisherCheck
                # PSScriptAnalyzer backs two gates: the approved-verb *function* check (PSUseApprovedVerbs)
                # in ScriptVerbHygiene.Tests.ps1 — whose file-name half is a custom Pester check — and
                # PSAvoidAssignmentToAutomaticVariable in AutomaticVariableHygiene.Tests.ps1. Both Describe
                # blocks skip themselves when it is absent, so forgetting it here would pass silently.
                Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
                # PoHeader.Tests.ps1 asserts the catalogue header contract against the COMMITTED files, so it
                # is the only check that catches a header drifting in by a route nobody anticipated -- a hand
                # edit, a writer nobody remembered to update, or a Weblate add-on writing a credit the
                # exclusion list rejects. That last one is not hypothetical: the add-on re-adds a bot credit
                # to every infectious-agents catalogue whenever those translations are touched, and a
                # translation pull request is exactly where no human is reading the diff.
                Invoke-Pester -Path scripts/modules/NeoIPC-Tools/Tests/DataDictionary.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/BuildReport.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/ScriptVerbHygiene.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/PlayData.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/MetadataContent.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/Metadata.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/MetadataVerify.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/PoHeader.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/AutomaticVariableHygiene.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/ReportInterpolationHygiene.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/PoTemplateChurn.Tests.ps1,scripts/modules/NeoIPC-Tools/Tests/GlossaryCasingHygiene.Tests.ps1 -CI

            - name: Generate data dictionary
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'metadata'
              shell: pwsh
              run: |
                # Generate the CSV + .xlsx data dictionary into the uploaded artifacts. Assembled from the
                # metadata/ directory alone — no DHIS2 API.
                ./scripts/Build-NeoIPCDataDictionary.ps1 -OutputDirectory ./artifacts/data-dictionary

            - name: Render metadata distribution packages
              if: github.ref_type != 'tag' || steps.rel.outputs.product == 'metadata'
              shell: pwsh
              run: |
                # Render the importable DHIS2 metadata packages (install base + play) into the uploaded artifacts.
                # Generated from the metadata/ directory alone — no DHIS2 API. NOT committed (undiffable compressed
                # blobs): they ship as this build artifact, and as a Release asset on a manually-published release.
                # The version is always explicit (the generator has no default): the parsed metadata release version
                # on a metadata release, else the metadata/VERSION file (the source of truth) for the preview artifact.
                $version = if ('${{ steps.rel.outputs.version }}') { '${{ steps.rel.outputs.version }}' } else { (Get-Content -LiteralPath ./metadata/VERSION -Raw).Trim() }
                ./scripts/Build-NeoIPCMetadataDistribution.ps1 -OutputDirectory ./artifacts/metadata-package -Version $version

            # ── Release assets ─────────────────────────────────────────────────────────────────────────────────
            # Only one product releases at a time, so ./artifacts/release-assets holds just that product's files.
            # protocol/metadata add their compatibility record alongside their built assets.
            - name: Stage the compatibility record
              if: github.ref_type == 'tag' && (steps.rel.outputs.product == 'protocol' || steps.rel.outputs.product == 'metadata' || steps.rel.outputs.product == 'reports')
              shell: bash
              run: |
                mkdir -p ./artifacts/release-assets
                case "${{ steps.rel.outputs.product }}" in
                  protocol) cp doc/protocol/compatibility.yml ./artifacts/release-assets/ ;;
                  metadata) cp metadata/compatibility.yml ./artifacts/release-assets/ ;;
                  reports)  cp reports/compatibility.yml ./artifacts/release-assets/ ;;
                esac
                ls -la ./artifacts/release-assets/

            - name: Bundle the printed collection forms, one archive per culture
              # The forms a partner prints, compiled by the protocol build into artifacts/<culture>/forms
              # (and artifacts/forms for the untranslated source). One archive each rather than loose PDFs:
              # a release's assets share a FLAT namespace, and every culture's forms carry the same file
              # names, so uploading them individually would have each culture overwrite the last.
              if: github.ref_type == 'tag' && steps.rel.outputs.product == 'protocol'
              shell: bash
              run: |
                mkdir -p ./artifacts/release-assets
                staged="$PWD/artifacts/release-assets"
                shopt -s nullglob
                for dir in ./artifacts/forms ./artifacts/*/forms; do
                  [ -d "$dir" ] || continue
                  culture=$(basename "$(dirname "$dir")")
                  case "$culture" in
                    artifacts) name="NeoIPC-Core-Collection-Forms" ;;
                    *)         name="NeoIPC-Core-Collection-Forms-$culture" ;;
                  esac
                  (cd "$dir" && zip -q -r "$staged/$name.zip" .)
                  echo "bundled $dir -> $name.zip"
                done
                # A protocol release without forms is a release missing a deliverable, so say so here rather
                # than letting the upload succeed with nothing to upload.
                ls "$staged"/NeoIPC-Core-Collection-Forms*.zip >/dev/null

            - name: Bundle the infectious agent list (source + translations)
              # Canonical YAML + the po4a-generated localized NeoIPC-Infectious-Agents.<lang>.yaml + the UID map.
              if: github.ref_type == 'tag' && steps.rel.outputs.product == 'infectious-agents'
              shell: bash
              run: |
                mkdir -p ./artifacts/release-assets
                out="$PWD/artifacts/release-assets/NeoIPC-Infectious-Agents-${{ steps.rel.outputs.version }}.tar.gz"
                cd metadata/common/infectious-agents
                # LICENSE.md + README.md travel with the list so the bundle carries its own attribution + effective license.
                files=(NeoIPC-Infectious-Agents.yaml NeoIPC-Infectious-Agents.uids.csv LICENSE.md README.md)
                for f in NeoIPC-Infectious-Agents.*.yaml; do [ -e "$f" ] && files+=("$f"); done
                tar czf "$out" "${files[@]}"
                echo "Bundled: ${files[*]}"

            - name: Bundle the antibiotics list (source + translation catalogue)
              # The substance/group CSVs + the gettext translation catalogue. Antibiotic-name translations are applied
              # to the DHIS2 option sets at metadata-build time from these catalogues — there is no standalone
              # localized list file, so the catalogue is the translation deliverable.
              if: github.ref_type == 'tag' && steps.rel.outputs.product == 'antibiotics'
              shell: bash
              run: |
                mkdir -p ./artifacts/release-assets
                out="$PWD/artifacts/release-assets/NeoIPC-Antibiotics-${{ steps.rel.outputs.version }}.tar.gz"
                files=(
                  metadata/common/antibiotics/NeoIPC-Antibiotics.csv
                  metadata/common/antibiotics/NeoIPC-Antibiotic-Groups.csv
                  metadata/common/antibiotics/NeoIPC-Antibiotic-AWaRe-Groups.csv
                  metadata/common/antibiotics/ListElements.csv
                  # LICENSE.md + README.md travel with the list so the bundle carries its own attribution + effective license.
                  metadata/common/antibiotics/LICENSE.md
                  metadata/common/antibiotics/README.md
                  po/antibiotics.pot
                )
                for f in po/antibiotics.*.po; do [ -e "$f" ] && files+=("$f"); done
                tar czf "$out" "${files[@]}"
                echo "Bundled: ${files[*]}"

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                name: NeoIPC-Surveillance-Toolkit
                path: ./artifacts/

    release-assets:
        # Create the product's GitHub Release and attach its rendered assets. Split out from build-docs so that
        # job runs with a read-only token; only this release-gated job needs contents: write. Triggered by a
        # `<product>-v*` tag push: create the Release (generated notes; pre-release when the tag carries a
        # pre-release suffix), then attach what build-docs rendered/staged. Exactly one product's attach step
        # fires, keyed off the product build-docs parsed from the tag.
        if: github.ref_type == 'tag'
        needs: build-docs
        runs-on: ubuntu-26.04
        permissions:
          contents: write
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        steps:
            - name: Download the rendered artifacts
              uses: actions/download-artifact@v7
              with:
                name: NeoIPC-Surveillance-Toolkit
                path: ./artifacts
            - name: Create the Release
              # Tag-driven: create the GitHub Release (generated notes) before attaching assets. Pre-release
              # only when the VERSION itself carries a semver pre-release suffix (e.g. -alpha, -preview1); a
              # plain X.Y.Z is final. Test the parsed version, NOT $TAG — every tag's <product>-v prefix
              # contains a hyphen, so matching $TAG would flag every release as a pre-release.
              shell: bash
              run: |
                ver='${{ needs.build-docs.outputs.version }}'
                pre=""; case "$ver" in *-*) pre="--prerelease";; esac
                # Idempotent: a re-run of this job re-executes create; skip if the Release already exists (a
                # partial earlier run may have created it) so the attach steps below still run.
                gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes $pre
            - name: Attach protocol documents
              # PDF + DOCX are self-contained; the HTML references artifacts/img/ so it is not attached as a bare
              # asset (an HTML bundle with its images is a possible future asset). compatibility.yml records the
              # incorporated shared-list versions.
              if: needs.build-docs.outputs.product == 'protocol'
              shell: bash
              run: gh release upload "$TAG" ./artifacts/*.pdf ./artifacts/*.docx ./artifacts/release-assets/* --clobber
            - name: Attach metadata packages and data dictionary
              if: needs.build-docs.outputs.product == 'metadata'
              shell: bash
              run: gh release upload "$TAG" ./artifacts/metadata-package/*.json ./artifacts/data-dictionary/* ./artifacts/release-assets/* --clobber
            - name: Attach source-product assets
              # reports (compatibility.yml), infectious-agents / antibiotics (the committed list source): the
              # render-ready / importable forms ship at the tag's source archive; these are convenience assets.
              if: contains(fromJSON('["reports","infectious-agents","antibiotics"]'), needs.build-docs.outputs.product)
              shell: bash
              run: gh release upload "$TAG" ./artifacts/release-assets/* --clobber
