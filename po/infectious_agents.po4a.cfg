[po4a_langs] af de el es et fr it ne tr
[po4a_paths] po/infectious_agents.pot $lang:po/infectious_agents.$lang.po
# --keep 0 (po4a's default is 80): an untranslated entry in this catalogue falls back to the English
# source, which for a taxon name *is* the nomenclatural name and therefore already correct. Gating the
# overlay behind a completeness threshold would withhold correct output over strings that need no
# translation — roughly 80% of this catalogue is Latin binomials and rank names. It also scales to a
# language whose convention does render organism names natively (Chinese, Ukrainian), where the
# remaining work is real and would otherwise block every other entry from being emitted.
[options] --width 0 --master-charset UTF-8 --localized-charset UTF-8 --wrap-po newlines --master-language en --keep 0 --msgid-bugs-address NeoIPC-Support@charite.de --copyright-holder "Charité – Universitätsmedizin Berlin" --package-name "NeoIPC Surveillance Infectious Agent List"

[type: yaml] metadata/common/infectious-agents/NeoIPC-Infectious-Agents.yaml $lang:metadata/common/infectious-agents/NeoIPC-Infectious-Agents.$lang.yaml opt:"-o keys='Name ConceptType Value'" # manual-keys
[type: asciidoc] metadata/common/infectious-agents/Output-Footer.adoc $lang:metadata/common/infectious-agents/Output-Footer.$lang.adoc opt:"-o compat=asciidoctor"
[type: asciidoc] metadata/common/infectious-agents/Output-Header.adoc $lang:metadata/common/infectious-agents/Output-Header.$lang.adoc opt:"-o compat=asciidoctor"
