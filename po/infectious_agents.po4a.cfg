[po4a_paths] po/infectious_agents.pot $lang:po/infectious_agents.$lang.po
# --keep 0 (po4a's default is 80): an untranslated entry in this catalogue falls back to the English
# source, which for a taxon name *is* the nomenclatural name and therefore already correct. Gating the
# overlay behind a completeness threshold would withhold correct output over strings that need no
# translation — roughly 80% of this catalogue is Latin binomials and rank names. It also scales to a
# language whose convention does render the names of infectious agents natively (Chinese, Ukrainian), where the
# remaining work is real and would otherwise block every other entry from being emitted.
[options] --width 0 --master-charset UTF-8 --localized-charset UTF-8 --wrap-po newlines --master-language en --keep 0 --msgid-bugs-address NeoIPC-Support@charite.de --copyright-holder "Charité – Universitätsmedizin Berlin" --package-name "NeoIPC Surveillance Infectious Agent List"

# The two YAML documents name the values they offer the catalogue by path, never by key: po4a's YAML module keeps the
# keys and paths of every document it reads in a run (Yaml.pm's file-level %yfm_keys and %yfm_paths, which initialize
# adds to and never clears), and po4a renders every document for one language before it turns to the next, so a key
# option on one document would translate the values of that key in every document it reads after it, in every language
# after the first: the classification's member and assignment names, which are names of ontology nodes, and its
# assignments' values, which are keys, among them. The two documents' paths share no first key.
# MetadataContent.Tests.ps1 checks both lines against their documents, and CI compares each localized classification
# with the canonical one.
#
# The reporting classification offers its own labels only: po4a matches a path by the mapping keys above a value, a
# list adding none, so these paths take the groups' names and definitions, to the depth of the tree, and the names of
# the attributes and their values. skip_array keeps the lists of evidence out, which po4a would otherwise extract
# whatever the paths say.
[type: yaml] metadata/common/infectious-agents/NeoIPC-Infectious-Agent-Reporting-Groups.yaml $lang:metadata/common/infectious-agents/NeoIPC-Infectious-Agent-Reporting-Groups.$lang.yaml opt:"-o skip_array -o paths='Groups Name,Groups Definition,Groups Children Name,Groups Children Definition,Groups Children Children Name,Groups Children Children Definition,Attributes Name,Attributes Values Name'" # manual-keys
# The list offers its nodes' names and ranks, at every depth of its tree, and its list terms. Its line continues over
# the lines that end in a backslash; the marker manual-keys stays on the first, where Update-Po4aYamlKeys.ps1 reads it.
[type: yaml] metadata/common/infectious-agents/NeoIPC-Infectious-Agents.yaml $lang:metadata/common/infectious-agents/NeoIPC-Infectious-Agents.$lang.yaml opt:"-o paths='\ # manual-keys
Hierarchies Name,Hierarchies ConceptType,Hierarchies Children Name,Hierarchies Children ConceptType,\
Hierarchies Children Children Name,Hierarchies Children Children ConceptType,Hierarchies Children Synonyms Name,\
Hierarchies Children Children Children Name,Hierarchies Children Children Children ConceptType,\
Hierarchies Children Children Children Children Name,Hierarchies Children Children Children Children ConceptType,\
Hierarchies Children Children Children Synonyms Name,Hierarchies Children Children Children Children Children Name,\
Hierarchies Children Children Children Children Children ConceptType,\
Hierarchies Children Children Children Children Children Children Name,\
Hierarchies Children Children Children Children Children Children ConceptType,\
Hierarchies Children Children Children Children Children Children Children Name,\
Hierarchies Children Children Children Children Children Children Children ConceptType,\
Hierarchies Children Children Children Children Children Children Synonyms Name,\
Hierarchies Children Children Children Children Children Children Children Children Name,\
Hierarchies Children Children Children Children Children Children Children Children ConceptType,\
Hierarchies Children Children Children Children Children Children Children Synonyms Name,\
Hierarchies Children Children Children Children Children Children Children Children Children Name,\
Hierarchies Children Children Children Children Children Children Children Children Children ConceptType,\
Hierarchies Children Children Children Children Children Children Children Children Synonyms Name,\
Hierarchies Children Children Children Children Children Children Children Children Children Children Name,\
Hierarchies Children Children Children Children Children Children Children Children Children Children ConceptType,\
Hierarchies Children Children Children Children Children Children Children Children Children Synonyms Name,\
Hierarchies Children Children Children Children Children Children Children Children Children Children Children Name,\
Hierarchies Children Children Children Children Children Children Children Children Children Children Children ConceptType,\
Hierarchies Children Children Children Children Children Children Children Children Children Children Synonyms Name,\
Hierarchies Children Children Children Children Children Children Children Children Children Children Children Children Name,\
Hierarchies Children Children Children Children Children Children Children Children Children Children Children Children ConceptType,\
Hierarchies Children Children Children Children Children Children Children Children Children Children Children Synonyms Name,\
Hierarchies Children Children Children Children Children Children Children Children Children Children Children Children Synonyms Name,\
Metadata ListTerms 3GCR Value,Metadata ListTerms Bacterium Value,Metadata ListTerms Carbapenems Value,\
Metadata ListTerms Colistin Value,Metadata ListTerms CommonCommensal Value,Metadata ListTerms Fungus Value,\
Metadata ListTerms Id Value,Metadata ListTerms MRSA Value,Metadata ListTerms Name Value,\
Metadata ListTerms ParentId Value,Metadata ListTerms Protozoon Value,Metadata ListTerms RecordedResistances Value,\
Metadata ListTerms Synonym Value,Metadata ListTerms SynonymFor Value,Metadata ListTerms Type Value,\
