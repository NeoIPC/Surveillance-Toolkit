[po4a_langs] af de el es et fr it ne tr
[po4a_paths] po/documentation.pot $lang:po/documentation.$lang.po
[options] --width 0 --master-charset UTF-8 --localized-charset UTF-8 --wrap-po newlines --master-language en --msgid-bugs-address NeoIPC-Support@charite.de --copyright-holder "Charité – Universitätsmedizin Berlin" --package-name "NeoIPC Surveillance Documentation"

# An image TARGET is not a translator's decision, so it is not offered as one. po4a extracts block-image
# targets by default, on the reasoning that a translation may want to point at a translated image -- and
# this document reaches its translated images the other way, through a per-culture image directory the
# build assembles, so every target here is a plain file name that is right in every language. Left
# extracted, the unit invites exactly the edit that breaks it: German answered
# NeoIPC-Core-Decision-Flow.svg with NeoIPC-Core-Decision-Flow.de.svg, which the new layout does not
# resolve, and a target that fails to resolve is the good case -- one that resolves to the English figure
# fails silently.
#
# `noimagetargets` also suppresses po4a's default registration of the image ATTRIBUTE list and of
# indexterm, so both are re-registered here: `image[...]` without the trailing `_` keeps the alt text,
# title and link translatable while leaving the target alone, which is the whole point. The definitions
# below carry no images, so the option would change nothing there.
[type: asciidoc] doc/protocol/NeoIPC-Core-Protocol.adoc $lang:doc/protocol/$lang/NeoIPC-Core-Protocol.adoc opt:"-o compat=asciidoctor" opt:"-o noimagetargets" opt:"-o macro='image[1,alt,title,link] indexterm[1,2,3]'"

# The eight definitions below carry --keep 0, overriding the 80 % threshold that governs this config.
# They are FRAGMENTS: the protocol include::s each one, so a language that clears the threshold on the
# protocol itself cannot build at all if one of its definitions was withheld. That is not hypothetical --
# German is at 91.89 % overall and NeoIPC-Core-LCBSI-With-Recognized-Pathogen-Definition.adoc holds two
# strings, neither translated, so at 80 % po4a discards the file and asciidoctor then fails the whole
# German build on a missing include.
#
# The threshold exists to stop a mostly-English document being published as though it were translated,
# and that judgement belongs to the document, not to each fragment it assembles: a two-string fragment's
# percentage carries no information about whether the protocol is fit to publish. Withholding the
# fragment does not protect anyone -- it only decides whether the reader gets the definition in English
# or gets no protocol at all. So the protocol keeps the 80 % gate and its fragments always render,
# in English until translated.
[type: asciidoc] doc/protocol/definitions/NeoIPC-Core-Clinical-Sepsis-Definition.adoc $lang:doc/protocol/$lang/definitions/NeoIPC-Core-Clinical-Sepsis-Definition.adoc opt:"-o compat=asciidoctor --keep 0"
[type: asciidoc] doc/protocol/definitions/NeoIPC-Core-Deep-Incisional-SSI-Definition.adoc $lang:doc/protocol/$lang/definitions/NeoIPC-Core-Deep-Incisional-SSI-Definition.adoc opt:"-o compat=asciidoctor --keep 0"
[type: asciidoc] doc/protocol/definitions/NeoIPC-Core-LCBSI-With-Common-Commensal-Definition.adoc $lang:doc/protocol/$lang/definitions/NeoIPC-Core-LCBSI-With-Common-Commensal-Definition.adoc opt:"-o compat=asciidoctor --keep 0"
[type: asciidoc] doc/protocol/definitions/NeoIPC-Core-LCBSI-With-Recognized-Pathogen-Definition.adoc $lang:doc/protocol/$lang/definitions/NeoIPC-Core-LCBSI-With-Recognized-Pathogen-Definition.adoc opt:"-o compat=asciidoctor --keep 0"
[type: asciidoc] doc/protocol/definitions/NeoIPC-Core-Necrotizing-Enterocolitis-Definition.adoc $lang:doc/protocol/$lang/definitions/NeoIPC-Core-Necrotizing-Enterocolitis-Definition.adoc opt:"-o compat=asciidoctor --keep 0"
[type: asciidoc] doc/protocol/definitions/NeoIPC-Core-Organ-Space-SSI-Definition.adoc $lang:doc/protocol/$lang/definitions/NeoIPC-Core-Organ-Space-SSI-Definition.adoc opt:"-o compat=asciidoctor --keep 0"
[type: asciidoc] doc/protocol/definitions/NeoIPC-Core-Pneumonia-Definition.adoc $lang:doc/protocol/$lang/definitions/NeoIPC-Core-Pneumonia-Definition.adoc opt:"-o compat=asciidoctor --keep 0"
[type: asciidoc] doc/protocol/definitions/NeoIPC-Core-Superficial-Incisional-SSI-Definition.adoc $lang:doc/protocol/$lang/definitions/NeoIPC-Core-Superficial-Incisional-SSI-Definition.adoc opt:"-o compat=asciidoctor --keep 0"

# Text the generated figures need -- the collection sheets and the decision flow -- in the same YAML shape
# every other string resource here uses, extracted by key like the infectious-agents catalogue above.
# --keep 0 for the same reason the definitions carry it: this is a fragment a figure is assembled from,
# and a figure with no words is not a safer artifact than a figure with English ones.
[type: yaml] common/figure-strings.yaml $lang:common/figure-strings.$lang.yaml opt:"--keep 0" opt:"-o keys='boolean_no boolean_yes chart_days chart_description chart_month_year chart_number chart_title chart_total comments decision_admitted decision_birthweight decision_description decision_eligible decision_gestational_age decision_ineligible decision_not_admitted decision_title footer_reference legend_many legend_one list_separator neoipc_project patient_identifier patient_name patient_note preview_version required resistance_organism_specific resistance_organism_specific_note section_enrolment section_patient sheet_description sheet_heading sheet_master_title unit_days'"
