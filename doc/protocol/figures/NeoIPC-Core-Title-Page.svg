<!-- The protocol's title page: a HAND-MAINTAINED skeleton, not build output. See the header of
     NeoIPC-Core-Decision-Flow.svg for the contract the build works to.

     It is placed as `:title-page-background-image:`, so it is a whole A4 page of which only the panel at
     the foot is drawn. Everything above that is the document's own title block, set by asciidoctor over
     the top of this.

     The URL is an ordinary text element rather than a labelled group, which is how a skeleton says a
     string is NOT translated: only a `<text>` inside a `<g>` is resolved, measured and re-placed, so
     anything outside one is passed through exactly as written. A web address is the same in every
     language.

     The funding statement names a glossary term rather than a figure string. It is terminology the
     reports print too, so a second copy here would be a second thing to keep in step; the build resolves
     the figure strings first and the glossary behind them.

     Two things the version this replaces carried are deliberately absent. It defined `cc` and `by`
     symbols that nothing ever used, some two kilobytes of path data drawing nothing. And it stamped a
     translator's name onto the German page alone; whether a document carries a credit at all, and in
     what form, belongs to the contributor acknowledgement work rather than to a figure. -->
<svg viewBox="0 0 21000 29700" xmlns="http://www.w3.org/2000/svg" role="img" xml:lang="en">
  <title>{neoipc_project}</title>
  <desc>{title_page_description}</desc>
  <style>
    text { font-family: 'Noto Serif'; fill: #000; }
    .project { font-size: 500px; line-height: 600px; font-weight: bold; }
    .funding { font-size: 350px; line-height: 420px; }
    .url { font-size: 400px; fill: #0083c1; }
    /* The panel the whole block sits on, and the two boxes that state where a label may go. An extent
       draws nothing; it is geometry, not decoration. */
    .panel { fill: #fff; stroke: #000; stroke-width: 20; }
    .extent { fill: none; stroke: none; }
  </style>
  <defs>
