project:
  output-dir: _output
date-meta: now
echo: false
# Uncomment for to debug Markdown or LaTeX files
#keep-md: true
#keep-tex: true
profile:
  group:
    - [en, de]
alwaysTrue: true
execute:
  error: true
filters:
  - "../filters/pandoc-quotes.lua"
format:
  html:
    link-external-icon: true
    link-external-newwindow: true
  pdf:
    template-partials:
      - before-body.tex
    documentclass: scrartcl
    # LuaLaTeX pinned: required for PDF/UA tagging and matches the .NET service (which injects it); PDF/A-2b
    # + PDF/UA-1 make Quarto emit \DocumentMetadata{tagging=on,…} — needs fig-alt on every figure and the
    # decorative logos marked as artifacts to actually pass PDF/UA.
    pdf-engine: lualatex
    pdf-standard: [a-2b, ua-1]
    mainfont: "EB Garamond"
    monofont: "EB Garamond"
    fontsize: 10pt
    classoption: [footsepline=true, plainfootsepline=true]
    papersize: a4paper
    fig-pos: 'H'
    tbl-pos: 'H'
    colorlinks: true
    geometry:
      - top=30mm
      - bottom=30mm
      - left=25mm
      - right=25mm
      - heightrounded
    include-in-header:
      text: |
        \usepackage{float}
        \usepackage{placeins}
        \floatplacement{figure}{H}
        \floatplacement{table}{H}
        \usepackage{graphicx}
        \usepackage{wrapfig}
        \usepackage{scrlayer-scrpage}
        \ModifyLayer[addvoffset=-.6ex]{scrheadings.foot.above.line}
        \ModifyLayer[addvoffset=-.6ex]{plain.scrheadings.foot.above.line}
        \ihead{\includegraphics[width=4cm]{../logos/LOGO_NEOIPC_2.png}}
        \ifoot*{\includegraphics[width=1.37cm]{../logos/eu-flag-hr.jpg}}
        \ofoot{\pagemark}
        \newcommand{\FooterText}{}
        \cfoot*{%
          \raggedright
          \hspace{1.6cm}\parbox{0.8\textwidth}{\FooterText}
        }
    number-sections: true
  docx:
    highlight-style: github
    number-sections: true
    reference-doc: ../common/reference.docx
