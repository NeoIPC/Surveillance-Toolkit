  "6":
    # Translators:
    # `{status}` is replaced by the surveillance end form's status as DHIS2 stores it: an English
    # code in capital letters, such as ACTIVE, which stays untranslated and is quoted because it is
    # a code. Keep it as written.
    description: >-
      The patient record has a completed enrolment but the surveillance end
      form is not completed (status is '{status}').
    # Translators:
    # What the rule checks, in one sentence that stands on its own and has no placeholder: the
    # report's header lists it when the rule was not applied, and the NeoIPC app shows it beside the
    # rule's checkbox on its Validation Report form. The app shows it as typed, so type your
