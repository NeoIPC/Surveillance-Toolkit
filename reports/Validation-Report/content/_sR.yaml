# NeoIPC Validation Report — String Resources
#
# Layer 3 in the string resource cascade (after glossary.yaml, common.yaml).
# Report-specific strings: problem descriptions, patient dashboard
# labels, section headings, and validation messages.
#
# Translated via po4a (po/reports.po4a.cfg) and Weblate.
# Do not edit generated files (content.<lang>/_sR.yaml) — edit .po files instead.
#
# Placeholders are `{named}` after the context fields `neoipcr::validate()`
# records for each rule (see its "Context fields" section); the names are
# part of the string and stay as they are in every translation.
#
# A comment block that begins with a `Translators:` line, directly above a key, is that string's
# explanation in Weblate, where translators read it: po4a does not carry comments into the
# catalogue, so each is entered there from here. Every other comment is for maintainers.
#
# Language: en

adm_problem_header_prefix: Admission event with the admission date
bsi_problem_header_prefix: Primary Sepsis/BSI event with the infection date
end_problem_header_prefix: Surveillance-End event with the surveillance end date
enrolment_problem_header_prefix: Enrolment with the admission date
# Translators:
# `{support_link}` is replaced by a link whose text is the translation of "support e-mail address"
# and which opens an e-mail to the NeoIPC support team. Keep it as written, where your sentence
# needs that phrase. "Rule number" refers to the number each problem in the list starts with.
exception_request_hint: >-
  If a problem listed below describes data that are correct as recorded, you
  can ask the NeoIPC support team for an exception through our
  {support_link}, naming the department, the patient's NeoIPC-ID, the form or
  the enrolment the problem concerns, and the rule number shown with the
  problem. The team assesses each request individually. An accepted exception
  is added to the exception list, and the problem then no longer appears in
  later reports, as long as the patient's NeoIPC-ID and the dates of the
  enrolment and of the form stay the same.
# Translators:
# The body of the e-mail the support link of the hint on requesting an exception opens in the
# reader's e-mail program, as it is typed here: keep its line breaks. The reader fills in what each
# line ending in a colon asks for.
exception_request_hint_email_body: |
  Dear NeoIPC Surveillance support team,
  Please consider an exception for this problem in my validation report.
  Department:
  NeoIPC-ID of the patient:
  Admission date of the enrolment:
  Form and its date:
  Rule number:
  Why the data are correct as recorded:
  Best regards,
exception_request_hint_email_subject: Request for a validation exception
# Translators:
# The title of the note on requesting an exception, a heading in the report: use your language's
# capitalization for document headings.
exception_request_hint_title: Requesting an Exception
hap_problem_header_prefix: Pneumonia event with the infection date

header:
  departments: Departments
  validation_exceptions: Validation exceptions
  validation_rules: Validation rules
nec_problem_header_prefix: Necrotizing enterocolitis event with the infection date
neoipc_surveillance_partner_code: NeoIPC Surveillance Partner Code
no_problems_detected: >-
  No problem was detected in the data of the departments listed above as of
  the date this report was created.
no_problems_detected_exempted: >-
  No problem was detected in the data of the departments listed above as of
  the date this report was created, apart from the records the exception list
  exempts, which the header counts.
# Translators:
# The tooltip of the link in each patient's heading, which opens the patient's dashboard in DHIS2.
# The report shows it as typed, without setting its quotation marks, so type your language's own
# apostrophe and quotation marks.
patient_problem_dashboard_link_description: >-
  Link to the patient’s tracked entity instance dashboard on the NeoIPC Data
  Management Platform
patient_problem_header_prefix: Patient with the NeoIPC-ID
# Translators:
# `{support_link}` is replaced by a link whose text is the translation of "support e-mail address"
# and which opens an e-mail to the NeoIPC support team. Keep it as written, where your sentence
# needs that phrase.
patient_problem_multiple_hint: >-
  We have detected more than one problem in this patient record. It can
  sometimes be difficult to fix multiple problems in a patient record, because
  one single error may be causing more than one problem, or fixing one problem
  may cause a new one. If you are unsure how to proceed, please get in touch
  with us via our {support_link} and we will be happy to help you.
# Translators:
# The body of the e-mail the support link opens in the reader's e-mail program, as it is typed here:
# keep its line breaks and type your language's own quotation marks. `{patient_id}` is replaced by
# the patient's NeoIPC ID as the department recorded it. Keep it as written.
patient_problem_multiple_hint_email_body: |
  Dear NeoIPC Surveillance support team,
  My validation report contains multiple errors for the patient with the id '{patient_id}'.
  Can you please have a look and get in touch with me?
  Best regards,
patient_problem_multiple_hint_email_subject: >-
  Support request regarding complex errors in a patient record
# Translators:
# The title of the note on a patient record with more than one problem, a heading in the report: use
# your language's capitalization for document headings.
patient_problem_multiple_hint_title: More Than One Problem in This Patient Record
# Translators:
# The label each problem in the list starts with, before the sentence describing it. `{rule}` is
# replaced by the number of the rule that found the problem, a whole number. Keep it as written, with
# the punctuation your language puts after a label.
problem_rule_label: "Rule {rule}:"
# Translators:
# The label a problem found by a warning starts with, in place of the one above: a warning points to
# data that may be correct as recorded. `{rule}` is replaced by the number of the rule, a whole number.
# Keep it as written, with the punctuation your language puts after a label.
problem_rule_label_warning: "Rule {rule} (warning):"
# Translators:
# A note after the introduction to the list of problems, shown when a problem in the list starts with
# the label for a warning ("Rule {rule} (warning):").
problems_warning_note: >-
  A problem labelled as a warning points to data that may be correct as
  recorded, so unlike the other problems it does not make the validation
  remove the patient record from the analyses. An enrolment that is still
  open stays out of them until its surveillance has ended, warning or not.
  Please check each warning all the same.
# Translators:
# The entry for the validation rules in the report's header when every rule was applied. `{count}`
# is replaced by the number of rules, a whole number. Keep it as written.
rules_applied_all: "All {count} rules"
# Translators:
# The entry for the validation rules in the report's header when only some were applied. `{applied}`
# is replaced by the number of rules applied and `{total}` by the number of rules there are, both
# whole numbers; `{not_applied}` by the list of the rules not applied, each as its number followed
# by its summary in parentheses, separated by semicolons. Keep all three as written.
rules_applied_subset: "{applied} of {total} rules; the rules not applied are {not_applied}"
# Translators:
# Follows each problem the report lists. `{reference}` is replaced by a link to the section that
# explains the problem, shown as the word for "Section" in the report's language and the section's
# number, such as "Section 3.2". Keep it as written.
see_problem_details: "See {reference}."
# Translators:
# Stands in place of a value a record lacks, inside a sentence: in quotation marks, in parentheses,
# after "from" or "to", and in the heading of a form after the label of its date. Write it as a
# phrase that reads in those places rather than as a label.
missing_value: not available
support_email_address_link_text: support e-mail address

# The appendix an administrator can add, listing the exception records of the report's departments
# that matched no record or exempted nothing.
unused_validation_exceptions:
  enrolment_date: Enrolment date
  exempts_nothing: Exempts nothing
  form: Form
  form_date: Form date
  # Translators:
  # The title of the appendix, a heading in the report: use your language's capitalization for
  # document headings.
  heading: Unused Validation Exceptions
  intro: >-
    The records of the validation exception list below concern the
    departments of this report and either match no record in their data or
    match one that the rule they name does not flag, so that they exempt
    nothing. The appendix serves the upkeep of the list and is not meant to be
    passed on.
  matches_nothing: Matches no record
  no_department_codes: >-
    The validation exception list does not name the department of its
    records, so they cannot be narrowed to the departments of this report,
    and none of them is listed.
  no_records: >-
    The validation exception list holds no record for the departments of this
    report.
  none_unused: >-
    Every record of the validation exception list for the departments of this
    report matches a record in their data. Each one whose rule this report
    applied exempted that record from the rule.
  not_applied: >-
    No validation exception list was applied to this report, so none of its
    records can be listed.
  outcome: Outcome
  patient: NeoIPC-ID
  rule: Rule
  unusable: >-
    The validation exception list could not be read or applied to the
    departments of this report, so none of its records can be listed.

# The definitions of the "Validation exceptions" entry in the report's header: the list's state, when
# it was uploaded, and the records it exempted from each rule.
validation_exceptions:
  applied: "Applied; records exempted:"
  applied_none_exempted: Applied; no record exempted
  none: No exception list
  # Translators:
  # `{rule}` is replaced by the number of a validation rule, a whole number; `{kind}` by the kind of
  # record the rule concerns, as translated in the strings "Patient records", "Patient admissions",
  # and "Forms"; and `{count}` by the number of such records the exception list exempted from the
  # rule, a whole number. Keep all three as written.
  rule_records: "Rule {rule} – {kind} ({count})"
  switched_off: Not applied; an administrator rendered this report without the exception list
  unusable: Not applied; the list could not be read or applied to these departments
  # Translators:
  # `{date}` is replaced by the day the list was uploaded, a date in the date format of the report's
  # language. Keep it as written.
  uploaded: "List uploaded on {date}"

# Each rule has a `description`, the sentence the report shows for one finding, and a `summary`, one
# sentence saying what the rule checks; the explanation above each is the one translators read.
problems:
  "1":
    description: >-
      The patient record does not have an enrolment.
    # Translators:
    # What the rule checks, in one sentence that stands on its own and has no placeholder: the
    # report's header lists it when the rule was not applied, and the NeoIPC app shows it beside the
    # rule's checkbox on its Validation Report form. The app shows it as typed, so type your
    # language's own apostrophe and quotation marks.
    summary: The patient record has no enrolment.
  "2":
    description: >-
      The patient record has a completed surveillance end form but the
      enrolment is still active.
    # Translators:
    # What the rule checks, in one sentence that stands on its own and has no placeholder: the
    # report's header lists it when the rule was not applied, and the NeoIPC app shows it beside the
    # rule's checkbox on its Validation Report form. The app shows it as typed, so type your
    # language's own apostrophe and quotation marks.
    summary: The surveillance end form is completed while the enrolment is still active.
  "3":
    # Translators:
    # `{occurredAt}` is replaced by the admission date on the admission form and `{enrolledAt}` by
    # the admission date in the enrolment, each a date in the date format of the report's language.
    # Keep both as written.
    description: >-
      The admission date in the admission form ({occurredAt}) differs from the
      admission date in the enrolment ({enrolledAt}).
    # Translators:
    # What the rule checks, in one sentence that stands on its own and has no placeholder: the
    # report's header lists it when the rule was not applied, and the NeoIPC app shows it beside the
    # rule's checkbox on its Validation Report form. The app shows it as typed, so type your
    # language's own apostrophe and quotation marks.
    summary: The admission date in the admission form differs from the admission date in the enrolment.
  "4":
    # Translators:
    # `{endOccurredAt}` is replaced by the surveillance end date on the surveillance end form and
    # `{admOccurredAt}` by the admission date on the admission form, each a date in the date format
    # of the report's language. Keep both as written.
    description: >-
      The date of the end of the surveillance ({endOccurredAt}) is earlier than
      the date of admission on the admission form ({admOccurredAt}).
    # Translators:
    # What the rule checks, in one sentence that stands on its own and has no placeholder: the
    # report's header lists it when the rule was not applied, and the NeoIPC app shows it beside the
    # rule's checkbox on its Validation Report form. The app shows it as typed, so type your
    # language's own apostrophe and quotation marks.
    summary: The surveillance end date is earlier than the admission date on the admission form.
  "5":
    # Translators:
    # `{status}` is replaced by the admission form's status as DHIS2 stores it: an English code in
    # capital letters, such as ACTIVE, which stays untranslated and is quoted because it is a code.
    # Keep it as written.
    description: >-
      The patient record's admission form is not completed (status is
      '{status}').
    # Translators:
    # What the rule checks, in one sentence that stands on its own and has no placeholder: the
    # report's header lists it when the rule was not applied, and the NeoIPC app shows it beside the
    # rule's checkbox on its Validation Report form. The app shows it as typed, so type your
