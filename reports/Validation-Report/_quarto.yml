project:
  output-dir: _output
date-meta: now
echo: false
# Uncomment for to debug Markdown or LaTeX files
#keep-md: true
#keep-tex: true
number-sections: true
format:
  html:
    link-external-icon: true
    link-external-newwindow: true
    css: validation-report.css
  pdf:
    documentclass: article
    # LuaLaTeX pinned: `pdf-standard` reaches LaTeX as \DocumentMetadata, which
    # needs LuaLaTeX. Pinning it here keeps every render path on one engine.
    pdf-engine: lualatex
    # archival a-4: Quarto turns tagging on only for a standard that requires
    # tagged structure, and Quarto's own pandoc filters load the caption
    # package — which the LaTeX Tagging Project's status table
    # (https://latex3.github.io/tagging-project/tagging-status/) records as
    # currently incompatible with tagging — into the reports' PDF renders, so
    # no accessibility claim stands verified here. The article class itself is
    # recorded as compatible; with tagging off,
    # scripts/Test-ReportPdfTagging.ps1 fails a rendered file that carries
    # structure its declaration does not claim.
    pdf-standard: [a-4]
    mainfont: "Noto Sans"
    monofont: "Noto Sans"
    fontsize: 10pt
    papersize: a4
    fig-pos: 'h'
    colorlinks: true
filters:
  - "../filters/pandoc-quotes.lua"
  - "../filters/fix-unnumbered-bookmarks.lua"
profile:
  group:
    - [en, de]
