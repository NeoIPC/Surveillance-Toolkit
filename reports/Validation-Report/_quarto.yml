project:
  output-dir: _output
date-meta: now
echo: false
# Uncomment for to debug Markdown or LaTeX files
#keep-md: true
#keep-tex: true
number-sections: true
format:
  html:
    link-external-icon: true
    link-external-newwindow: true
  pdf:
    documentclass: scrartcl
    # LuaLaTeX pinned: the LaTeX tagging engine requires it, and pinning it here
    # keeps every render path on the same engine (the .NET service injects the
    # same value on its own path).
    pdf-engine: lualatex
    # Archival only. PDF/UA-2 is deliberately NOT declared: it requires tagged
    # structure, and KOMA-Script does not support LaTeX tagging — under
    # `documentclass: scrartcl` it warns "Activated tagging detected but not
    # supported!" and emits headings as ordinary paragraph text (no Sect /
    # section / subsection structure elements), so declaring ua-2 would assert a
    # conformance the file does not have. Re-declare it only once the reports
    # move to a tagging-capable class.
    pdf-standard: [a-4]
    mainfont: "Noto Sans"
    monofont: "Noto Sans"
    fontsize: 10pt
    papersize: a4paper
    fig-pos: 'h'
    colorlinks: true
filters:
  - "../filters/pandoc-quotes.lua"
  - "../filters/fix-unnumbered-bookmarks.lua"
profile:
  group: 
    - [en, de]