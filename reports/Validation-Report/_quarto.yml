project:
  output-dir: _output
date-meta: now
echo: false
# Uncomment for to debug Markdown or LaTeX files
#keep-md: true
#keep-tex: true
number-sections: true
format:
  html:
    link-external-icon: true
    link-external-newwindow: true
  pdf:
    documentclass: scrartcl
    # LuaLaTeX pinned: required for PDF/UA tagging and matches the .NET service (which injects it); PDF/A-2b
    # + PDF/UA-1 make Quarto emit \DocumentMetadata{tagging=on,…} — needs fig-alt on every figure and the
    # decorative logos marked as artifacts to actually pass PDF/UA.
    pdf-engine: lualatex
    pdf-standard: [a-2b, ua-1]
    mainfont: "Noto Sans"
    monofont: "Noto Sans"
    fontsize: 10pt
    papersize: a4paper
    fig-pos: 'h'
    colorlinks: true
filters:
  - "../filters/pandoc-quotes.lua"
  - "../filters/fix-unnumbered-bookmarks.lua"
profile:
  group: 
    - [en, de]