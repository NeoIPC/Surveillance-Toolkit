project:
  output-dir: _output
date-meta: now
echo: false
engine: knitr
filters: ["../filters/pandoc-quotes.lua"]
format:
  html:
    link-external-icon: true
    link-external-newwindow: true
  pdf:
    documentclass: scrartcl
    # LuaLaTeX pinned: required for PDF/UA tagging and matches the .NET service (which injects it). PDF/A-4
    # + PDF/UA-2 (both PDF 2.0) make Quarto emit \DocumentMetadata{pdfstandard, tagging=on, …} — needs
    # fig-alt on every figure and the decorative logos marked as artifacts to actually pass PDF/UA.
    pdf-engine: lualatex
    pdf-standard: [a-4, ua-2]
    mainfont: "Noto Sans"
    monofont: "Noto Sans"
    fontsize: 10pt
    papersize: a4paper
    fig-pos: 'H'
    colorlinks: true
    geometry:
      - top=25mm
      - bottom=25mm
      - left=25mm
      - right=25mm
      - heightrounded
    include-in-header:
      text: |
        \usepackage{float}
        \usepackage{placeins}
        \floatplacement{figure}{H}
        \usepackage{graphicx}
        \usepackage{scrlayer-scrpage}
        \ModifyLayer[addvoffset=-.6ex]{scrheadings.foot.above.line}
        \ModifyLayer[addvoffset=-.6ex]{plain.scrheadings.foot.above.line}
        \ihead{\includegraphics[width=4cm]{../logos/LOGO_NEOIPC_2.png}}
        \ofoot{\pagemark}
    classoption: [footsepline=true, plainfootsepline=true]
profile:
  group:
    - [en, de]
