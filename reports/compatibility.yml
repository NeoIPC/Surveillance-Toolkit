# Compatibility record for the NeoIPC Surveillance Reports product.
#
# Declares the neoipcr (R analysis package) and neoipc-app (reporting frontend) versions this
# reports release was validated against, plus the minimum version each report source is known to
# require. The reports (Quarto + R) depend on neoipcr's data contract, and the report parameter
# schema is consumed by neoipc-app — so both are genuine compatibility axes.
#
# Bump these together with reports/VERSION when cutting a `reports-vX.Y.Z` release. The
# NeoIPC-Reporting container mirrors the concrete pins it bakes in its own pinned-sources.yml and
# should keep them within the ranges declared here.
#
# `tested`  — the exact version this reports release was rendered and checked against.
# `minimum` — the earliest version known to work; leave equal to `tested` until an older floor is
#             actually established by testing.

neoipcr:
  # The floor is the first neoipcr that grades the validation rules and records what an exception
  # list exempted (v0.0.0.9008). The Validation Report labels a warning's problem from
  # `validation_rule_severities()`, counts the records the list exempted with
  # `validation_summary()` from the findings `validate()` records as exempted, and builds its
  # appendix with `validation_exception_usage()`; an older package has none of these, so the
  # report's setup fails. Its catalogue also carries rule 62's sentence and the days rule 54
  # records, which its setup checks against the fields the package's rules record.
  # Below it sits the first neoipcr whose import reconciles the stored values (v0.0.0.9007). The
  # Patient Data Report passes `reconcile = FALSE`, so that its copy of the stored record shows
  # every value as stored, and an older `dhis2_dataset_options()` rejects the argument, which
  # fails the report at its import. The Validation Report's catalogue carries the sentences of
  # rules 58 to 61, and its setup aborts under an older package: it checks the field each label
  # decoration reads against the fields the package's rules record, and an older package has no
  # rule 61 to record the SSI type that rule's sentence names. The Partner and Reference Reports
  # print the reconciliation summary the import records from this tag on; under an older one their
  # figures would rest on values as stored while the table said that no reconciliation was
  # recorded. The same tag has rule 57 read a gestational-age text as a recorded gestational age.
  # Below that sits the first neoipcr the Patient Data Report's import works with (v0.0.0.9006): the
  # report imports with timestamps and enrolment notes, which failed every import below it (on the
  # events' timestamps, and on notes read without the DHIS2 enrolment ids), and with pseudonymized
  # users, which failed it for records without a creator: events created before the instance's
  # upgrade to DHIS2 2.36, enrolments and tracked entities before 2.37. That tag carries rule 57, a
  # patient with neither birth weight nor gestational age, which the Validation Report's catalogue
  # describes, and the eligibility filter that leaves a missing value to the validation pass, so
  # that rule 46 reports a missing day of life. Below that sit rules 45 to 56 (v0.0.0.9005), whose
  # sentences the Validation Report's catalogue carries and whose `multiple_birth` patient column
  # its import selects; an older package fails the report's setup at that import, whose
  # `dhis2_dataset_options()` does not accept `multiple_birth`. Below that sit the reporting
  # period that selects the enrolments before the validation pass (v0.0.0.9004; below that
  # tag the period took effect through rule 25, so the validation summary the Partner and
  # Reference Reports print counted every out-of-period patient as removed), rules 43 and 44
  # (v0.0.0.9003), the exported `validate()` with its exception-list API
  # (`validation_rule_ids()`, `read_validation_exceptions()`, v0.0.0.9002) and the Reference
  # Report's `get_antibiotic_utilization_table()` (v0.0.0.9001). A renamed field is
  # NOT part of the floor: a serialized dataset written under the old name is accepted
  # permanently, by the shim marked NEOIPC-PERMANENT(dataset-format) in the Partner
  # Report's setup. Nor is a dataset written before the reconciliation summary existed: the
  # reconciliation table of either report says that none was recorded for it, in the branch
  # marked NEOIPC-PERMANENT(dataset-format). The release gate checks only that a declared tag
  # exists, and only `tested`, so nothing here would catch a floor set too low.
  tested: v0.0.0.9008
  minimum: v0.0.0.9008

neoipc-app:
  tested: v0.3.0-alpha
  minimum: v0.3.0-alpha
