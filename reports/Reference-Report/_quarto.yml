project:
  output-dir: _output
profile:
  group:
    - [en, de, el, es, et, it]
date-meta: now
alwaysTrue: true
echo: false
# Uncomment for to debug Markdown or LaTeX files
#keep-md: true
#keep-tex: true
execute:
  error: true
filters:
  - "../filters/pandoc-quotes.lua"
  - "../filters/fix-gt-footnote-display-math.lua"
format:
  html:
    link-external-icon: true
    link-external-newwindow: true
  pdf:
    template-partials:
      - before-body.tex
    documentclass: article
    # LuaLaTeX pinned: `pdf-standard` reaches LaTeX as \DocumentMetadata, which
    # needs LuaLaTeX. Pinning it here keeps every render path on one engine (the
    # .NET service injects the same value on its own path).
    pdf-engine: lualatex
    # archival a-4: Quarto turns tagging on only for a standard that requires
    # tagged structure, and Quarto's own pandoc filters load the caption
    # package — which the LaTeX Tagging Project's status table
    # (https://latex3.github.io/tagging-project/tagging-status/) records as
    # currently incompatible with tagging — into the reports' PDF renders, so
    # no accessibility claim stands verified here. The article class itself is
    # recorded as compatible; with tagging off,
    # scripts/Test-ReportPdfTagging.ps1 fails a rendered file that carries
    # structure its declaration does not claim.
    pdf-standard: [a-4]
    # PDF/A-4 requires every font to be embedded. R's pdf() device, which
    # Quarto's `fig-format: pdf` selects, writes a figure's text in the standard
    # Helvetica without embedding it; the Cairo device embeds the fonts it uses.
    # Quarto's `fig-format` has no value for it, so it is set as a knitr option.
    # The family must resolve to a font in the Compact Font Format (CFF): Cairo
    # embeds a TrueType font's glyphs outside WinAnsi as a CID-keyed font without
    # the CIDToGIDMap entry PDF/A-4 requires. So must every font Noto Sans falls
    # back to for a glyph it lacks, such as ≥ or a letter outside Latin, Greek,
    # and Cyrillic. The rendering image serves Noto Sans and every other Noto
    # Sans family from the Noto project's static OTFs, which are CFF, under the
    # SIL OFL, with fontconfig rules that leave out their TrueType builds and
    # DejaVu; a render on a host needs both as well.
    knitr:
      opts_chunk:
        dev: cairo_pdf
        dev.args:
          cairo_pdf:
            family: "Noto Sans"
    mainfont: "EB Garamond"
    monofont: "EB Garamond"
    fontsize: 10pt
    papersize: a4
    fig-pos: 'H'
    tbl-pos: 'H'
    colorlinks: true
    geometry:
      - top=30mm
      - bottom=30mm
      - left=25mm
      - right=25mm
      - heightrounded
      # geometry computes the top margin when it loads, before the header
      # block below runs, so the height the header occupies is its option,
      # not a later \setlength: raising \headheight after geometry has left
      # the text block ~39 pt below the declared top margin. A 4 cm logo
      # with the line box around it needs 54.02 pt, rounded up to 54.1 pt.
      - headheight=54.1pt
    number-sections: true
    include-in-header:
      text: |
        \usepackage{float}
        \usepackage{placeins}
        \floatplacement{figure}{H}
        \floatplacement{table}{H}
        \usepackage{graphicx}
        \usepackage{fancyhdr}
        \pagestyle{fancy}
        \fancyhf{}
        \fancyhead[L]{\includegraphics[width=4cm]{../logos/LOGO_NEOIPC_2.png}}
        \fancyfoot[L]{\includegraphics[width=1.37cm]{../logos/eu-flag.png}}
        \fancyfoot[R]{\thepage}
        \newcommand{\FooterText}{}
        \fancyfoot[C]{%
          \raggedright
          \hspace{1.6cm}\parbox{0.8\textwidth}{\FooterText}
        }
        % The reports carry a rule above the footer on every page including the
        % title page: \footrulewidth draws it on both page styles, the plain
        % (title) page mirrors the fancy footer, and with \headrule emptied the
        % header carries no rule.
        \renewcommand{\footrulewidth}{0.4pt}
        \renewcommand{\headrule}{}
        \fancypagestyle{plain}{%
          \fancyhf{}
          \fancyfoot[L]{\includegraphics[width=1.37cm]{../logos/eu-flag.png}}
          \fancyfoot[R]{\thepage}
          \fancyfoot[C]{%
            \raggedright
            \hspace{1.6cm}\parbox{0.8\textwidth}{\FooterText}
          }
        }
  docx:
    highlight-style: github
    number-sections: true
    reference-doc: ../common/reference.docx
