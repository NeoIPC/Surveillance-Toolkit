# Languages whose sentence-case behaviour has been checked, and the term-level exceptions.
#
# There is only one rule and it is not configurable: uppercase the FIRST CHARACTER, through
# stringr::str_to_upper(locale = …), which resolves the language's own casing via ICU. Turkish `i`
# therefore becomes `İ` where base toupper() gives a plain `I` outside a Turkish process locale, and
# languages nobody here has enumerated are covered by the same delegation — Azerbaijani shares the
# Turkish rule, Lithuanian has its own. A caseless script comes back unchanged without needing to be
# named.
#
# NOT str_to_sentence() and NOT str_to_title(), despite the names: both normalise the WHOLE string, and
# this glossary is largely abbreviations. Measured against the values the retired `_sc` keys held,
# uppercasing the first character alone reproduces 6 of 6, while str_to_sentence() reproduces 5 — it
# turns "primary sepsis/BSI" into "Primary sepsis/bsi". str_to_title() renders "AWaRe" as "Aware".
#
# So why does this file exist at all, if the rule is fixed and ICU handles the locale?
#
# Because ICU fails OPEN. An unrecognised locale does not raise — `str_to_upper("i", locale = "xx")`
# quietly falls back to the root locale and returns a perfectly plausible "I". Adding a tenth language
# would therefore render with a rule nobody had checked, and be wrong only for the languages where it
# matters, silently, in a published clinical report. This list is what turns that into a build failure.
# Presence is the entire content of an entry; there is deliberately nothing to configure.

languages:
  # The source language: a default render resolves its locale exactly as a translated one does.
  - en
  - af
  - de
  - el
  - es
  - et
  - fr
  - it
  - ne
  - tr

# Sentence-case forms no rule can produce, keyed by language then glossary key. Empty, and expected to
# stay that way: the known candidate is a term opening with the Afrikaans article 'n, which takes the
# capital on the following word. The renderer refuses any term not starting with a letter rather than
# guessing, so such a term stops the build until it is given its form here.
overrides: {}
