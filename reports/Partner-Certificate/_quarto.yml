project:
  output-dir: _output
profile:
  group:
    - [en, de, it]
date-meta: now
echo: false
engine: knitr
filters: ["../filters/pandoc-quotes.lua"]
format:
  pdf:
    template-partials:
      - before-body.tex
      - title.tex
    documentclass: article
    # LuaLaTeX pinned: `pdf-standard` reaches LaTeX as \DocumentMetadata, which
    # needs LuaLaTeX. Pinning it here keeps every render path on one engine.
    # (No html format → no axe here.)
    pdf-engine: lualatex
    # Archival only. PDF/UA-2 is deliberately NOT declared: it requires tagged
    # structure, and the textpos package that lays out this certificate's single
    # page is recorded as currently incompatible with LaTeX tagging in the LaTeX
    # Tagging Project's status table
    # (https://latex3.github.io/tagging-project/tagging-status/), so under
    # tagging=on the structure would be wrong and the declaration would assert a
    # conformance the file does not have.
    pdf-standard: [a-4]
    mainfont: "Noto Sans"
    monofont: "Noto Sans"
    fontsize: 12pt
    papersize: a4
    geometry:
      - top=15mm
      - bottom=20mm
      - left=25mm
      - right=25mm
      - heightrounded
    include-in-header:
      # Strip chomping: a block scalar that ends the file loses its final line break to R's yaml alone, and Pandoc's
      # template sets each header include on a line of its own.
      text: |-
        \usepackage{microtype}
        \usepackage[absolute]{textpos}
        \usepackage{float}
        \usepackage{placeins}
        \usepackage{graphicx}
        \usepackage{fancyhdr}
        \pagestyle{fancy}
        \fancyhf{}
        \newcommand{\CertFooterText}{}
        \fancyfoot[L]{\footnotesize\includegraphics[width=1.37cm]{../logos/eu-flag.png}}
        \fancyfoot[C]{\footnotesize\parbox[b]{\linewidth}{\raggedright\leftskip=1.5cm\relax\CertFooterText}}
        % A rule spans the footer on every page: \footrulewidth draws it, and the
        % plain (title) page mirrors the footer, so the \maketitle page carries
        % the flag and the funding text too — the body renews \CertFooterText,
        % and both page styles read it at ship-out. \footnotesize sizes the
        % footer material because the certificate body is 12 pt.
        \renewcommand{\footrulewidth}{0.4pt}
        \renewcommand{\headrule}{}
        \fancypagestyle{plain}{%
          \fancyhf{}
          \fancyfoot[L]{\footnotesize\includegraphics[width=1.37cm]{../logos/eu-flag.png}}
          \fancyfoot[C]{\footnotesize\parbox[b]{\linewidth}{\raggedright\leftskip=1.5cm\relax\CertFooterText}}
        }
