# NeoIPC Surveillance Glossary
#
# Managed via bilingual gettext PO for Weblate (not po4a): the key becomes msgctxt, the English value
# becomes msgid.
# Run `python scripts/update-glossary-po.py` after editing this file.
#
# Weblate feature mapping (YAML → PO):
#   Descriptions  — YAML comments above a key become PO translator notes (#.)
#   Context       — YAML key becomes msgctxt (enables variant_regex grouping)
#   Location      — source file path + line number written as #: occurrence
#   Flags         — `# flags: ...` comment line becomes PO #, flags
#   Needs editing — fuzzy flag in .po, managed by Weblate; preserved across merges
#
# Keep a blank line between this header and the first key. ruamel hands both to the generator as
# one block, which splits them on the last blank line — without it, a note on the first key would
# be read as part of this header and never reach translators.
#
# Naming convention:
#   base key    = AMA canonical (lowercase). ONE key per term — there are no casing variants here.
#   Abbreviations (CVC, HAP, INV, NEC, SSI) are always uppercase — no variants.
#   Proper nouns (NeoIPC Surveillance) keep their canonical casing.
#
# CASING IS NOT STORED HERE. `key_sc` is derived at render time from the base term, and `key_tc` no
# longer exists at all. Casing is a rendering concern — the renderer knows whether it is starting a
# label or a sentence; the translator supplies the term. Three things were wrong with storing it:
# translators translated the same word twice; every cased variant produced a second, identical hit in
# every other component's glossary sidebar, diluting the terminology decisions it exists to carry; and
# the casing axis multiplied against the plural axis, so one term needing six Arabic forms would have
# needed eighteen keys. Title case was carried for five terms and rendered by nothing at all.
#
# The rule is `sentence_case()` in reports/common/helpers.R: uppercase the FIRST CHARACTER ONLY, through
# stringr's locale-aware casing, so Turkish `i` becomes `İ` and a caseless script comes back unchanged.
# Never str_to_sentence() or str_to_title() — both normalise the whole string, which would render
# "primary sepsis/BSI" as "Primary sepsis/bsi" and "AWaRe" as "Aware".
#
# Available flags (see https://docs.weblate.org/en/latest/admin/checks.html):
#   read-only          — non-editable, translation locked
#   ignore-same        — suppress "unchanged translation" warning
#   max-length:N       — character limit
#   priority:N         — translation priority (default 100)
#   placeholders:...   — expected placeholder strings
#   regex:PATTERN      — translation must match regex
#
# Variant grouping is handled by the Weblate component's variant_regex setting, which still needs to
# cover the plural suffix. It groups variants in THIS component's own translation view and does not
# reach the glossary sidebar other components show, which is a separate lookup — established by
# observation rather than inferred, back when a protocol string containing "Kangaroo care" produced two
# sidebar hits carrying the same German while variant_regex was set correctly.
#
# That doubling is what retiring the casing variants removed: sixteen of the fifty-two keys here were
# casing variants of a key that was also present, so a third of the file duplicated itself in the
# sidebar wherever it matched. Neither hit was wrong — both said the same thing — which is precisely
# why it was worth removing rather than fixing: it cost translator attention and taught nothing.

# Resistance category: third-generation cephalosporin resistance.
# flags: terminology
3gcr: "3GCR"
# WHO AWaRe antibiotic category. The official WHO translation is normative: Spanish "Acceso", per the
# WHO AWaRe antibiotic book. Do not invent a local rendering.
# flags: terminology
access: "Access"
admission: admission
antibiotics: antibiotics
# Physical status classification of the American Society of Anesthesiologists, printed on the surgical
# procedure sheet with its Roman-numeral classes.
#
# No ignore-same, deliberately, and the same for the seven abbreviations below: this project has NOT
# decided that they stay in Latin script, and suppressing the unchanged-translation check would settle
# that question by never asking it. A form whose row labels are Latin acronyms is localized in name
# only, and whether a Nepali or Hebrew reader wants "ASA" or a transliteration is a fact about clinical
# practice in that language, which the reviewer knows and this file does not. The terms that DO carry
# ignore-same carry it because a decision was recorded first.
# flags: terminology
asa: "ASA"
# AWaRe is a WHO acronym (Access, Watch, Reserve) — not translatable
# flags: read-only, terminology
aware: "AWaRe"
# Bloodstream infection.
# flags: terminology
bsi: "BSI"
# Birthweight.
# flags: terminology
bw: "BW"
# Resistance category: carbapenem resistance.
# flags: terminology
carbr: "CARBR"
# Resistance category: colistin resistance.
# flags: terminology
colr: "COLR"
# Continuous Positive Airway Pressure, a mode of non-invasive ventilatory support.
# flags: terminology
cpap: "CPAP"
# C-reactive protein, an inflammatory marker the sepsis and pneumonia sheets ask about.
# flags: terminology
crp: "CRP"
# Central Venous Catheter.
# flags: terminology
cvc: CVC
# Resistance mechanism: extended-spectrum beta-lactamase. Underlies 3GCR rather than being a category
# of its own.
# flags: terminology
esbl: ESBL
# Gestational age.
# flags: terminology
ga: "GA"
h2020_funding_statement: >-
  This project has received funding from the European Union's Horizon 2020
  research and innovation programme under grant agreement No 965328.
# Hospital-acquired pneumonia.
# flags: terminology
hap: HAP
# High-Flow Nasal Cannula, a mode of non-invasive ventilatory support.
# flags: terminology
hfnc: "HFNC"
human_milk: "human milk"
# Ratio of immature to total neutrophils. Written as the bare abbreviation rather than "I/T ratio" so
# that it matches the token as it appears in a label, which is what puts it in a translator's sidebar.
# flags: terminology
i_t: "I/T"
# International Classification of Health Interventions, the WHO classification the surgical procedure
# codes come from.
# flags: terminology
ichi: "ICHI"
# Interleukin, an inflammatory marker; the sepsis sheet asks about IL-6 and IL-8.
# flags: terminology
il: "IL"
# Invasive Ventilation.
# flags: terminology
inv: INV
kangaroo_care: "kangaroo care"
# Laboratory-confirmed bloodstream infection.
# flags: terminology
lcbsi: "LCBSI"
# Resistance category: methicillin-resistant Staphylococcus aureus.
# flags: terminology
mrsa: "MRSA"
# Necrotizing Enterocolitis. An initialism, so most languages keep it verbatim; suppress the
# unchanged-translation check rather than have every language answer it. Declared here because a flag
# set on a catalogue does not survive msgmerge — gettext models no custom flags, so only the template's
# are restored.
# flags: ignore-same, terminology
nec: NEC
necrotizing_enterocolitis: "necrotizing enterocolitis"
# flags: ignore-same
neoipc_surveillance: "NeoIPC Surveillance"
# Non-invasive Ventilation.
# flags: terminology
niv: NIV
pneumonia: pneumonia
primary_sepsis_bsi: "primary sepsis/BSI"
probiotics: Probiotics
# Peripheral Venous Catheter.
# flags: terminology
pvc: PVC
# WHO AWaRe antibiotic category. The official WHO translation is normative: Spanish "Reserva", per the
# WHO AWaRe antibiotic book.
# flags: terminology
reserve: "Reserve"
# Surgical Site Infection.
# flags: terminology
ssi: SSI
surgical_procedure: "surgical procedure"
surgical_site_infection: "surgical site infection"
surveillance: surveillance
surveillance_end: "surveillance end"
# Very Low Birth Weight. One of the two criteria that make an infant eligible, so it heads every sheet.
# flags: terminology
vlbw: "VLBW"
# Very Preterm. The other eligibility criterion, and the reason both appear together on every heading.
# flags: terminology
vpt: "VPT"
# Resistance category: vancomycin-resistant Enterococcus.
# flags: terminology
vre: "VRE"
# WHO AWaRe antibiotic category. The official WHO translation is normative: Spanish "Precaución", per
# the WHO AWaRe antibiotic book — NOT "Vigilancia", which this project uses for "surveillance" and
# would therefore collide, and not the bare verb "Ver". Italian is deliberately left untranslated
# rather than inheriting "Sorveglianza" from the reports catalogue, which has the same collision; it
# needs the WHO Italian edition rather than a guess.
# flags: terminology
watch: "Watch"
