# NeoIPC Surveillance Glossary
#
# Managed via bilingual gettext PO for Weblate (not po4a): the key becomes msgctxt, the English value
# becomes msgid.
# Run `python scripts/update-glossary-po.py` after editing this file.
#
# Weblate feature mapping (YAML → PO):
#   Plurals       — key + key_plural paired into msgid / msgid_plural. Two limits, and the generator
#                   refuses rather than emitting something wrong in either case, before it writes any
#                   file. (a) TWO SLOTS ONLY, so a language declaring three or six forms cannot be
#                   represented. No entry uses a plural family today, which is why Ukrainian, Russian
#                   (3 forms) and Arabic (6) are unaffected — it is adding the first family while one
#                   of them is present that would force the schema to grow. (b) NO CASED PLURAL KEY:
#                   `key_plural_tc` and `key_plural_sc` resolve to the same base as `key_plural`, so the
#                   cased key is swallowed — it never becomes an entry, its value is attached to the
#                   uncased base, and it comes back named `key_plural`. Do not author one at all; give
#                   the plural a single uncased `key_plural` and let the case variants be plain keys.
#   Descriptions  — YAML comments above a key become PO translator notes (#.)
#   Context       — YAML key becomes msgctxt (enables variant_regex grouping)
#   Location      — source file path + line number written as #: occurrence
#   Flags         — `# flags: ...` comment line becomes PO #, flags
#   Needs editing — fuzzy flag in .po, managed by Weblate; preserved across merges
#
# Keep a blank line between this header and the first key. ruamel hands both to the generator as
# one block, which splits them on the last blank line — without it, a note on the first key would
# be read as part of this header and never reach translators.
#
# Naming convention:
#   base key    = AMA canonical (lowercase)
#   key_sc      = Sentence case (first word capitalised)
#   key_tc      = Title case (all major words capitalised)
#   key_plural  = Plural form
#   Suffixes can combine in principle, but NOT key_plural_tc / key_plural_sc — the generator refuses
#     them, because pairing cannot keep a cased plural apart from the uncased one. See Plurals above.
#   Abbreviations (CVC, HAP, INV, NEC, SSI) are always uppercase — no variants.
#   Proper nouns (NeoIPC Surveillance) keep their canonical casing.
#
# Available flags (see https://docs.weblate.org/en/latest/admin/checks.html):
#   read-only          — non-editable, translation locked
#   ignore-same        — suppress "unchanged translation" warning
#   max-length:N       — character limit
#   priority:N         — translation priority (default 100)
#   placeholders:...   — expected placeholder strings
#   regex:PATTERN      — translation must match regex
#
# Variant grouping is handled by the Weblate component's variant_regex
# setting: _(tc|sc|plural|plural_tc|plural_sc)$

# WHO AWaRe antibiotic category. The official WHO translation is normative: Spanish "Acceso", per the
# WHO AWaRe antibiotic book. Do not invent a local rendering.
# flags: terminology
access: "Access"
admission: admission
admission_sc: Admission
antibiotics: antibiotics
antibiotics_sc: Antibiotics
# AWaRe is a WHO acronym (Access, Watch, Reserve) — not translatable
# flags: read-only, terminology
aware: "AWaRe"
cvc: CVC
h2020_funding_statement: >-
  This project has received funding from the European Union's Horizon 2020
  research and innovation programme under grant agreement No 965328.
hap: HAP
human_milk: "human milk"
human_milk_sc: "Human milk"
inv: INV
kangaroo_care: "kangaroo care"
kangaroo_care_sc: "Kangaroo care"
# An initialism, so most languages keep it verbatim; suppress the unchanged-translation check rather
# than have every language answer it. Declared here because a flag set on a catalogue does not survive
# msgmerge — gettext models no custom flags, so only the template's are restored.
# flags: ignore-same
nec: NEC
necrotising_enterocolitis: "necrotising enterocolitis"
necrotising_enterocolitis_sc: "Necrotising enterocolitis"
necrotising_enterocolitis_tc: "Necrotising Enterocolitis"
# flags: ignore-same
neoipc_surveillance: "NeoIPC Surveillance"
niv: NIV
pneumonia: pneumonia
pneumonia_sc: Pneumonia
primary_sepsis_bsi: "primary sepsis/BSI"
primary_sepsis_bsi_sc: "Primary sepsis/BSI"
primary_sepsis_bsi_tc: "Primary Sepsis/BSI"
probiotics: Probiotics
pvc: PVC
# WHO AWaRe antibiotic category. The official WHO translation is normative: Spanish "Reserva", per the
# WHO AWaRe antibiotic book.
# flags: terminology
reserve: "Reserve"
ssi: SSI
surgical_procedure: "surgical procedure"
surgical_procedure_sc: "Surgical procedure"
surgical_procedure_tc: "Surgical Procedure"
surgical_site_infection: "surgical site infection"
surgical_site_infection_sc: "Surgical site infection"
surgical_site_infection_tc: "Surgical Site Infection"
surveillance: surveillance
# Several languages render this identically to English in its sentence-case form; same reasoning as `nec`.
# flags: ignore-same
surveillance_sc: Surveillance
surveillance_end: "surveillance end"
surveillance_end_sc: "Surveillance end"
surveillance_end_tc: "Surveillance End"
# WHO AWaRe antibiotic category. The official WHO translation is normative: Spanish "Precaución", per
# the WHO AWaRe antibiotic book — NOT "Vigilancia", which this project uses for "surveillance" and
# would therefore collide, and not the bare verb "Ver". Italian is deliberately left untranslated
# rather than inheriting "Sorveglianza" from the reports catalogue, which has the same collision; it
# needs the WHO Italian edition rather than a guess.
# flags: terminology
watch: "Watch"
